<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E6A5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="いえトレ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>いえトレ手帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Barlow+Condensed:wght@500;600&display=swap">

<style>
:root{
  --bg:#EFF2F1; --surface:#FFFFFF; --surface-2:#F5F7F6; --ink:#17201E; --muted:#5B6764; --line:#DADFDD;
  --accent:#2E6A5C; --accent-ink:#FFFFFF; --accent-soft:#E1ECE8;
  --warn:#8A5410; --warn-soft:#F6ECDC; --danger:#A1332A; --danger-soft:#F8E3E0; --info:#34588C; --info-soft:#E4EBF5;
  --shadow:0 1px 2px rgba(18,32,28,.05),0 2px 8px rgba(18,32,28,.04);
  --radius:16px;
  --font:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --num:"Barlow Condensed","BIZ UDPGothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111615; --surface:#1A211F; --surface-2:#212927; --ink:#E5ECE9; --muted:#9BA8A4; --line:#2E3836;
    --accent:#7CC0AC; --accent-ink:#0E1A17; --accent-soft:#1E3530;
    --warn:#E0B274; --warn-soft:#352A1B; --danger:#F09A90; --danger-soft:#3A2220; --info:#9DB9E6; --info-soft:#1F2A3A;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111615; --surface:#1A211F; --surface-2:#212927; --ink:#E5ECE9; --muted:#9BA8A4; --line:#2E3836;
  --accent:#7CC0AC; --accent-ink:#0E1A17; --accent-soft:#1E3530;
  --warn:#E0B274; --warn-soft:#352A1B; --danger:#F09A90; --danger-soft:#3A2220; --info:#9DB9E6; --info-soft:#1F2A3A;
  --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 120px}
.wrap.no-tab{padding-block-end:40px}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
h2{font-size:21px}
h3{font-size:18px}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.label{font-size:12.5px;color:var(--muted);letter-spacing:.06em;font-weight:700}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card.quiet{background:var(--surface-2)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.brand{font-size:19px;letter-spacing:.02em}
.btn{min-height:52px;border-radius:14px;font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.3;-webkit-tap-highlight-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-hero{min-height:66px;font-size:18.5px;width:100%;border-radius:18px}
.btn-block{width:100%}
.btn-sm{min-height:44px;font-size:14.5px;padding:0 14px;border-radius:12px}
.btn-link{background:none;border:none;color:var(--accent);font:inherit;font-weight:700;padding:8px 4px;min-height:44px;cursor:pointer}
.btn-danger{color:var(--danger);border-color:var(--danger-soft)}
.btn-danger-solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.seg{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:6px}
.opt{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px;font-weight:700;cursor:pointer;padding:6px 8px;line-height:1.25}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt:disabled{opacity:.4}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .opt{min-height:44px;padding:6px 14px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days .opt{min-height:46px;padding:0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.up{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.caution{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.pain{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.chip.lvl{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.note{border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.55;background:var(--surface-2);color:var(--muted)}
.note.info{background:var(--info-soft);color:var(--info)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.pain{background:var(--danger-soft);color:var(--danger)}
.note strong{display:block;margin-bottom:2px}
.field{display:flex;flex-direction:column;gap:8px}
.field > .label{margin-bottom:2px}
.divider{height:1px;background:var(--line);margin:4px 0}
input[type=text],textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
textarea{min-height:88px;resize:vertical}
details > summary{cursor:pointer;list-style:none;min-height:44px;display:flex;align-items:center;gap:6px;font-weight:700;color:var(--accent);font-size:14.5px}
details > summary::-webkit-details-marker{display:none}
details > summary::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);margin-right:4px}
details[open] > summary::before{transform:rotate(45deg)}

/* plan / exercise cards */
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex-var{font-size:14px;color:var(--muted)}
.target-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:12px;align-items:end}
.target-big{font-family:var(--num);font-weight:600;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.target-big .u{font-family:var(--font);font-size:15px;font-weight:700;margin-left:2px}
.target-big .x{font-size:22px;color:var(--muted);margin:0 4px}
.prev{font-family:var(--num);font-size:22px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.logic{display:grid;gap:4px;font-size:14px;background:var(--surface-2);border-radius:12px;padding:12px}
.logic .arrow{color:var(--muted);font-size:13px}
.done-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14.5px}
.check{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.card.is-done{background:var(--surface-2)}
.card.is-rest{background:transparent;border-style:dashed;box-shadow:none}

/* exercise screen */
.hero-target{font-family:var(--num);font-weight:600;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.hero-target .u{font-family:var(--font);font-size:18px;font-weight:700;margin-left:4px}
.hero-target .x{font-size:32px;color:var(--muted);margin:0 6px}
.setrow{display:grid;grid-template-columns:52px 1fr 60px;align-items:center;gap:10px}
.setno{font-weight:700;color:var(--muted);font-size:14px}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.stepper button{min-height:54px;border:none;background:var(--surface-2);color:var(--ink);font-size:24px;font-weight:700;cursor:pointer}
.stepper input{border:none;min-width:0;width:100%;text-align:center;font-family:var(--num);font-size:30px;font-weight:600;color:var(--ink);background:var(--surface);font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.setcheck{min-height:54px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:22px;font-weight:700;color:var(--muted);cursor:pointer}
.setcheck[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.feel{display:grid;gap:8px}
.feel .opt{min-height:54px;display:flex;align-items:center;gap:12px;text-align:left;padding:0 16px;font-size:16px}
.feel .opt .n{font-family:var(--num);font-size:22px;width:18px;opacity:.7}
.error{color:var(--danger);font-weight:700;font-size:14px}
.toast{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 14px;font-weight:700;font-size:14.5px}

/* home */
.dots{display:flex;gap:8px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent)}
.dot.on{background:var(--accent)}
.change-list{display:grid;gap:10px}
.change-item{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px}
.change-item .v{font-family:var(--num);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}

/* history */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);border-radius:14px;padding:4px;border:1px solid var(--line)}
.tabs .opt{border:none;background:transparent;min-height:42px}
.tabs .opt[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.hist-ex{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);text-align:left;background:none;border-left:none;border-right:none;border-bottom:none;font:inherit;color:inherit;width:100%;cursor:pointer}
.hist-ex:first-child{border-top:none}
.hist-ex .reps{font-family:var(--num);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.prog{width:100%;border-collapse:collapse;font-size:14.5px}
.prog th{font-size:12px;color:var(--muted);text-align:left;font-weight:700;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
.prog td{padding:10px 8px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
.prog td.r{font-family:var(--num);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.table-wrap{overflow-x:auto}

/* goal editor */
.goal{padding:14px 0;border-top:1px solid var(--line)}
.goal:first-child{border-top:none;padding-top:4px}
.goal-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;align-items:end}
select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;min-height:48px}
input[type=number].plain{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
.goal input[data-in="goalload"]{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.stepper.sm{grid-template-columns:44px 1fr 44px}
.stepper.sm button{min-height:46px;font-size:20px}
.stepper.sm input{font-size:24px}
.warm-item{display:flex;align-items:center;gap:12px;min-height:56px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 14px;font:inherit;color:var(--ink);cursor:pointer}
.warm-item .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.warm-item[aria-pressed="true"]{background:var(--surface-2);color:var(--muted)}
.warm-item[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* tab bar */
#tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
#tabbar .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
#tabbar button{background:none;border:none;color:var(--muted);font:inherit;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;justify-content:center;cursor:pointer;border-radius:12px}
#tabbar button[aria-current="page"]{color:var(--accent)}
#tabbar svg{width:24px;height:24px}

/* dialog */
dialog{border:none;border-radius:20px;padding:0;width:min(560px,calc(100% - 24px));max-height:88dvh;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,16,14,.45)}
.dlg-body{padding:20px;display:flex;flex-direction:column;gap:16px;overflow:auto;max-height:88dvh}
.video-empty{aspect-ratio:16/9;max-width:100%;border-radius:14px;background:var(--surface-2);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700}
.video{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;background:#000}
.video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0}
@supports not (aspect-ratio:16/9){.video,.video-empty{height:0;padding-top:56.25%}}
.video-empty{padding:12px;text-align:center;line-height:1.5}
.video-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tiny{font-size:11.5px}
.linkish{background:none;border:none;padding:4px 0;min-height:36px;font:inherit;color:var(--accent);font-weight:700;text-align:left;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.dlg-rest{position:sticky;top:0;z-index:1;align-self:flex-start;background:var(--ink);color:var(--bg);border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.dlg-rest.done{background:var(--accent);color:var(--accent-ink)}
.dlg-list{margin:0;padding-left:1.2em;display:grid;gap:4px}
.vars{display:grid;gap:6px;font-size:14.5px}
.vars .cur{font-weight:700;color:var(--accent)}
/* rest timer */
#restbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.rb-inner{pointer-events:auto;max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:20px;padding:12px 14px 14px;box-shadow:0 10px 28px rgba(0,0,0,.2);display:grid;gap:10px}
.rb-inner.done{background:var(--accent);color:var(--accent-ink)}
.rb-progress{height:4px;border-radius:4px;background:rgba(127,127,127,.35);overflow:hidden}
.rb-progress span{display:block;height:100%;background:currentColor;width:0;transition:width .25s linear}
.rb-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.rb-label{font-weight:700;font-size:15px}
.rb-sub{font-size:12.5px;opacity:.8}
.rb-time{font-family:var(--num);font-weight:600;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.rb-btns{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:8px}
.rb-btns .btn{min-height:48px;padding:0 8px;font-size:14.5px}
body.has-restbar .wrap{padding-block-end:230px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* weekly sets */
.wsets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wsets div{background:var(--surface-2);border-radius:12px;padding:8px 10px}
.wsets .k{font-size:11.5px;letter-spacing:.08em;font-weight:700;color:var(--muted)}
.wsets .v{font-family:var(--num);font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.pill-ok{color:var(--accent)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media (min-width:600px){.wrap{padding-block-start:28px}}
</style>

</head>
<body>
<div id="app" aria-live="polite"></div>

<nav id="tabbar" aria-label="メインメニュー" hidden>
  <div class="inner">
    <button type="button" data-act="nav" data-to="home" aria-label="ホーム">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>ホーム</button>
    <button type="button" data-act="nav" data-to="history" aria-label="履歴">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9"/></svg>履歴</button>
    <button type="button" data-act="nav" data-to="settings" aria-label="設定">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>設定</button>
  </div>
</nav>

<dialog id="dlg" aria-labelledby="dlgTitle"><div class="dlg-body" id="dlgBody"></div></dialog>

<div id="restbar" hidden>
  <div class="rb-inner">
    <div class="rb-progress" aria-hidden="true"><span id="rbFill"></span></div>
    <div class="rb-row">
      <div><div class="rb-label" id="rbLabel">休憩</div><div class="rb-sub" id="rbSub"></div></div>
      <div class="rb-time" id="rbTime" role="timer" aria-label="残りの休憩時間">0:00</div>
    </div>
    <div class="rb-btns">
      <button type="button" class="btn" data-act="restadd">＋30秒</button>
      <button type="button" class="btn" data-act="restend">休憩を終了</button>
      <button type="button" class="btn btn-primary" data-act="restnext">次のセット</button>
    </div>
  </div>
</div>
<div id="srLive" class="sr-only" aria-live="assertive"></div>

<script>
'use strict';
/* =========================================================
   1. DATA — 種目ライブラリ・テンプレート（ここだけ編集すれば種目追加可能）
   ========================================================= */
const APP_VERSION = 3;
const STORE_KEY = 'ietore-v1';

const EQUIP = [
  {id:'abroller', label:'アブローラー'},
  {id:'dumbbell', label:'ダンベル'},
  {id:'backpack', label:'リュック'},
  {id:'bottle',   label:'ペットボトル'},
  {id:'chair',    label:'椅子・段差'},
  {id:'none',     label:'特になし'}
];
const LOAD = ['backpack','bottle','dumbbell'];  // どれか1つあれば「負荷追加」可能
const WEEK = [{v:1,l:'月'},{v:2,l:'火'},{v:3,l:'水'},{v:4,l:'木'},{v:5,l:'金'},{v:6,l:'土'},{v:0,l:'日'}];
const WD = ['日','月','火','水','木','金','土'];
const FEEL = {1:'かなり余裕',2:'少し余裕',3:'ちょうどいい',4:'かなりきつい',5:'完遂できなかった'};
const FORM = {good:'フォーム良好', slight:'フォーム少し崩れた', bad:'フォーム崩れた'};
const PAIN = {none:'痛みなし', discomfort:'違和感', pain:'痛みあり'};
const PAIN_ACTION = {
  rom:'可動域を小さくして据え置き',
  easier:'1段階やさしいバリエーションにする',
  swap:'代替種目に変更する',
  rest:'次回はこの種目を休む'
};

const SET_GROUP_LABEL = {push:'PUSH', pull:'PULL', legs:'LEGS', core:'CORE', shoulder:'SHOULDER CARE'};
/* 他の運動の強度（前日の調整に使う） */
const SPORT_INT = {light:'軽め', normal:'通常', hard:'高強度・試合'};
/* 停滞判定の比較から外す理由 */
const EXCLUDE_LABEL = {short:'短縮モード', condition:'コンディション調整', sport:'他の運動の前日調整', reducedSets:'セット数を減らした日',
  stopped:'途中中止', pain:'痛みあり', discomfort:'違和感あり', form:'フォーム不良', weight:'重量変更', newVariation:'バリエーション変更直後',

};

/* variation = {id,name,level,repMin,repMax,tempo,load,equip,perSide?,videoUrl?} */
function V(id, name, repMin, repMax, x){ return Object.assign({id, name, repMin, repMax, tempo:null, load:null, equip:[]}, x||{}); }
const EX = {};
/* exercise = {id,name,category,priority,type,unit,perSide,sets,tags,start,variations,cues,mistakes,videoUrl,alternatives,baseEquip}
   priority: 1=大筋群(脚) 2=主要プッシュ/プル・股関節 3=体幹 4=補助  → 短縮モードの残す順
   start: 経験 [初心者, 少し経験あり, 継続している] ごとの開始値。数値=variation番号（目標は下限）、
          {v:variationId, t:目標回数, s:セット数} で個別指定も可
   tags: legs / shoulder → 他の運動の前日に控えめにする対象
   variation.wp: true → 上限到達時に「重量を上げる」を提案できる（ダンベル・リュック負荷）
   variation.loaded: 器具で負荷をかける段階（自動判定）→ 使用重量(kg)を記録 */
function defEx(o){
  o.variations.forEach((v,i)=>{
    v.level=i; v.equip=v.equip||[];
    v.loaded=v.equip.some(g=>g.some(x=>LOAD.includes(x)));
    v.loadStep=v.loadStep||(v.equip.some(g=>g.length===1&&g[0]==='dumbbell')?1:0.5);
  });
  o.baseEquip=o.baseEquip||[]; o.videoUrl=o.videoUrl||''; o.tags=o.tags||[];
  o.restSec=o.restSec||REST_DEFAULT[o.category]||60;
  EX[o.id]=o;
}

/* =========================================================
   2. STORE — localStorage + JSONバックアップ
   ========================================================= */
const Store = {
  ok:true,
  load(){
    try{ const s=localStorage.getItem(STORE_KEY); return s?JSON.parse(s):null; }
    catch(e){ this.ok=false; return null; }
  },
  save(state){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); this.ok=true; }
    catch(e){ this.ok=false; }
  }
};
function defaultState(){
  return {version:APP_VERSION, settings:null, exercises:{}, subs:{}, rotation:0, sessions:[], active:null};
}
function migrate(s){
  const d=defaultState();
  if(!s||typeof s!=='object') return d;
  const out=Object.assign(d, s);
  out.exercises=out.exercises||{}; out.subs=out.subs||{}; out.sessions=Array.isArray(out.sessions)?out.sessions:[];
  out.rotation=+out.rotation||0;
  // v1 → v2：進捗の主キーを variation 配列の番号から variationId へ
  const vidOf=(ex,lv)=>ex&&ex.variations[lv|0]?ex.variations[lv|0].id:null;
  Object.keys(out.exercises).forEach(id=>{
    const st=out.exercises[id], ex=EX[id]; if(!ex||!st) return;
    if(!st.variationId) st.variationId=vidOf(ex,st.level);
    if(st.last && !st.last.variationId) st.last.variationId=vidOf(ex,st.last.level);
    if(st.sets===undefined) st.sets=null;
    if(st.load===undefined) st.load=null;
  });
  out.sessions.forEach(ses=>(ses.exercises||[]).forEach(r=>{ if(!r.variationId) r.variationId=vidOf(EX[r.exerciseId],r.level); }));
  if(out.active&&Array.isArray(out.active.items)) out.active.items.forEach(it=>{ if(!it.variationId) it.variationId=vidOf(EX[it.exerciseId],it.level); });
  // v2 → v3：痛みの連続回数・休止フラグ・休憩秒・停滞判定用フラグ・設定項目
  Object.keys(out.exercises).forEach(id=>{
    const st=out.exercises[id]; if(!EX[id]||!st) return;
    if(st.painStreak===undefined){
      const rs=[]; out.sessions.forEach(ses=>(ses.exercises||[]).forEach(r=>{ if(r.exerciseId===id && r.status!=='skipped') rs.push(r); }));
      let n=0; for(let k=rs.length-1;k>=0;k--){ if(rs[k].pain==='pain') n++; else break; } st.painStreak=n;
    }
    if(st.pausedByPain===undefined) st.pausedByPain=false;   // 過去の記録だけで自動休止にはしない
    if(st.restSec===undefined) st.restSec=null;
    if(st.loadLabel===undefined) st.loadLabel='';
  });
  out.sessions.forEach(ses=>(ses.exercises||[]).forEach(r=>{ if(r.progressEligible===undefined){ r.progressEligible=null; r.excludeReasons=['legacy']; } }));
  if(out.settings){ if(out.settings.restSound===undefined) out.settings.restSound=false; if(!out.settings.sportIntensity) out.settings.sportIntensity={}; }
  out.version=APP_VERSION;
  return out;
}
function isValidBackup(o){ return o && typeof o==='object' && o.settings && typeof o.settings==='object' && Array.isArray(o.sessions) && o.exercises && typeof o.exercises==='object'; }

const $ = s=>document.querySelector(s);
function h(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ymd(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseYmd(s){ const p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function addDays(d,n){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; }
function mdw(s){ const d=parseYmd(s); return (d.getMonth()+1)+'/'+d.getDate()+'（'+WD[d.getDay()]+'）'; }
function md(s){ const d=parseYmd(s); return (d.getMonth()+1)+'/'+d.getDate(); }
function weekStart(d){ const wd=(d.getDay()+6)%7; return addDays(d,-wd); }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }

/* =========================================================
   4. ENGINE — 次回目標の決定（ルールベース・ダブルプログレッション）
   進捗の主キーは variationId。level（配列番号）は表示・比較用に毎回IDから再計算する
   ========================================================= */
const Engine = {
  eq(){ return (S.settings&&S.settings.equipment)||[]; },
  stepOf(ex){ return ex.type==='time'?5:1; },
  avail(ex,v,eq){
    eq=eq||this.eq();
    return ex.baseEquip.concat(v.equip).every(g=>g.some(x=>eq.includes(x)));
  },
  anyAvail(ex,eq){ return ex.variations.some(v=>this.avail(ex,v,eq)); },
  fitLevel(ex,level,eq){
    for(let i=Math.min(level,ex.variations.length-1);i>=0;i--) if(this.avail(ex,ex.variations[i],eq)) return i;
    for(let i=level+1;i<ex.variations.length;i++) if(this.avail(ex,ex.variations[i],eq)) return i;
    return -1;
  },
  harder(ex,level){ for(let i=level+1;i<ex.variations.length;i++) if(this.avail(ex,ex.variations[i])) return i; return -1; },
  easier(ex,level){ for(let i=level-1;i>=0;i--) if(this.avail(ex,ex.variations[i])) return i; return -1; },
  idx(ex,vid){ return ex.variations.findIndex(v=>v.id===vid); },
  setLevel(st,ex,i){ st.level=i; st.variationId=ex.variations[i].id; },
  setsOf(ex,st){ return (st&&st.sets)||ex.sets; },
  restOf(ex,st){ return (st&&st.restSec)||ex.restSec; },
  sameEquip(a,b){ return JSON.stringify(a.equip)===JSON.stringify(b.equip); },

  /* 経験・器具から決まる既定の開始値（{variationId,target,sets,load}） */
  defaultGoal(id, experience, eq){
    const ex=EX[id]; const expIdx={beginner:0,some:1,regular:2}[experience];
    const sp=ex.start[expIdx==null?1:expIdx];
    let lv=sp, t=null, sets=null;
    if(sp && typeof sp==='object'){ lv=this.idx(ex,sp.v); t=sp.t; sets=sp.s||null; }
    if(lv<0) lv=0;
    let f=this.fitLevel(ex,lv,eq); if(f<0) f=0;
    const v=ex.variations[f];
    return {variationId:v.id, target:(f===lv&&t!=null)?clamp(t,v.repMin,v.repMax):v.repMin, sets:sets||ex.sets, rest:ex.restSec, load:v.defaultLoad!=null?v.defaultLoad:null};
  },
  newState(id, goal){
    const ex=EX[id]; const g=goal||this.defaultGoal(id, S.settings.experience);
    let i=this.idx(ex,g.variationId); if(i<0) i=0;
    const v=ex.variations[i];
    return {variationId:v.id, level:i, target:clamp(+g.target||v.repMin, v.repMin, v.repMax),
      sets:(+g.sets && +g.sets!==ex.sets)?+g.sets:null, restSec:(+g.rest && +g.rest!==ex.restSec)?+g.rest:null,
      load:(g.load!=null&&g.load!=='')?+g.load:null, loadLabel:g.loadLabel||'',
      topCount:0, sessions:0, levelUpReady:false, last:null, lastDecision:null, painNote:null, skipNext:false, painStreak:0, pausedByPain:false};
  },

  /* 種目ごとの進捗状態（なければ既定の開始値で初期化） */
  state(id){
    const ex=EX[id]; let st=S.exercises[id];
    if(!st){ st=this.newState(id); S.exercises[id]=st; }
    let i=this.idx(ex,st.variationId);
    if(i<0) i=clamp(st.level|0,0,ex.variations.length-1);   // 未知のIDは旧番号で救済
    this.setLevel(st,ex,i);
    const f=this.fitLevel(ex,st.level);
    if(f>=0 && f!==st.level){
      const v=ex.variations[f]; this.setLevel(st,ex,f); st.target=clamp(st.target,v.repMin,v.repMax); st.topCount=0; st.levelUpReady=false;
    }
    return st;
  },

  /* 手動で目標を設定（設定画面の「開始値・現在の目標」） */
  setGoal(id, g){
    const ex=EX[id], st=this.state(id); let i=this.idx(ex,g.variationId); if(i<0) i=st.level;
    const v=ex.variations[i];
    this.setLevel(st,ex,i); st.target=clamp(+g.target||v.repMin, v.repMin, v.repMax);
    st.sets=(+g.sets && +g.sets!==ex.sets)?+g.sets:null;
    st.restSec=(+g.rest && +g.rest!==ex.restSec)?+g.rest:null;
    st.load=(g.load!=null&&g.load!=='')?+g.load:null;
    st.topCount=0; st.levelUpReady=false;
    st.lastDecision={code:'manual', label:'手動で設定', reason:'設定画面で目標を変更しました', rule:'',
      to:{level:i, variationId:v.id, target:st.target}};
  },

  /* 予定スロット → 実際に行う種目（痛みでの代替・器具不足での代替） */
  resolve(slot, daySlots){
    let id=S.subs[slot]||slot; if(!EX[id]) id=slot;
    if(this.anyAvail(EX[id])) return {id, reason:id!==slot?'sub':null};
    const cands=EX[id].alternatives.concat(EX[slot].alternatives);
    for(const a of cands){ if(a!==slot && EX[a] && !daySlots.includes(a) && this.anyAvail(EX[a])) return {id:a, reason:'equip'}; }
    return null;
  },
  pickAlt(slot, curId, daySlots){
    const cands=EX[curId].alternatives.concat(EX[slot].alternatives);
    for(const a of cands){ if(a!==curId && a!==slot && EX[a] && !daySlots.includes(a) && this.anyAvail(EX[a])) return a; }
    return null;
  },

  evaluate(ex, st, r, daySlots){
    const d=this.judge(ex, st, r, daySlots);
    d.to.variationId=ex.variations[d.to.level].id; d.from.variationId=r.variationId;
    return d;
  },

  /* ---- コア：1種目の結果から次回を判定 ----
     r = {level,target,plannedSets,sets:[{reps,done}],feel,form,pain,painAction,status,load,plannedLoad} */
  judge(ex, st, r, daySlots){
    const v=ex.variations[r.level], step=this.stepOf(ex), u=ex.unit, T=r.target;
    const reps=r.sets.map(s=>s.done?(+s.reps||0):0);
    const n=reps.length;
    const misses=reps.filter(x=>x<T).length;
    const allHit=n>0 && misses===0;
    const bigGap= ex.type==='time' ? Math.max(10,Math.round(T*0.2)) : Math.max(2,Math.round(T*0.15));
    const bigMisses=reps.filter(x=>x<=T-bigGap).length;
    const deficit=reps.reduce((a,x)=>a+Math.max(0,T-x),0);
    const minA=n?Math.min.apply(null,reps):0;
    const calib=st.sessions<2;
    const d={rule:'', code:'hold', label:'据え置き', reason:'', from:{level:r.level,target:T,load:r.plannedLoad}, to:{level:r.level,target:T}, topCount:0, levelUpReady:false, calib};

    // 途中中止（痛みなし）→ 据え置き
    if(r.status==='stopped' && r.pain!=='pain'){
      d.rule='中止'; d.reason='途中で中止したため据え置き'+(r.pain==='discomfort'?'（違和感あり）':'');
      return d;
    }

    // --- A〜F：生の判定 ---
    let next=T, raw='';
    if(allHit){
      const base=Math.min(Math.max(T,minA), v.repMax);   // 目標以上できた分は反映
      let inc=0;
      if(r.feel===1){ inc= calib?3*step : (base+2*step<=v.repMax?2*step:step); d.rule='A'; raw='全セット達成＋かなり余裕だったため'; }
      else if(r.feel===2){ inc= calib?2*step:step; d.rule='B'; raw='全セット達成＋少し余裕だったため'; }
      else if(r.feel===3){ d.rule='C'; raw='全セット達成・ちょうどいい負荷だったため'; }
      else { d.rule='D'; raw='全セット達成したが、かなりきつかったため'; }
      next=Math.min(base+inc, v.repMax);
    } else if(bigMisses>=2){
      const dec=(deficit/n>=3*step)?2*step:step; next=T-dec; d.rule='F'; raw='複数セットで目標に大きく届かなかったため';
    } else {
      const dec=(deficit>=3*step || (r.feel===5 && misses>=2))?step:0; next=T-dec; d.rule='E';
      raw= dec?'一部のセットで目標に届かず、不足がやや大きかったため':'一部のセットで目標に届かなかったため';
    }

    // --- H：痛みあり（負荷は絶対に上げない） ---
    if(r.pain==='pain'){
      next=Math.min(next,T); d.rule+='+H'; d.to.target=next;
      const act=r.painAction||'rom';
      if(act==='easier'){
        const e=this.easier(ex,r.level);
        if(e>=0){ const ev=ex.variations[e]; d.to={level:e, target:Math.min(ev.repMax, ev.repMin+2*step)}; d.code='leveldown'; d.label='難易度ダウン'; d.reason=`痛みがあったため、${ev.name}に変更します（負荷は上げません）`; }
        else { d.code='pain'; d.label='痛みのため据え置き'; d.reason='痛みがあったため負荷を上げません。これ以上やさしいバリエーションがないため、可動域を小さくして様子を見ます'; }
      } else if(act==='swap'){
        const alt=this.pickAlt(r.slotId, ex.id, daySlots||[]);
        if(alt){ d.code='swap'; d.swapTo=alt; d.label='代替種目へ変更'; d.reason=`痛みがあったため、次回から${EX[alt].name}に変更します`; }
        else { d.code='pain'; d.label='痛みのため据え置き'; d.reason='痛みがあったため負荷を上げません（使える代替種目がないため可動域を小さくして様子を見ます）'; }
      } else if(act==='rest'){
        d.code='rest'; d.label='次回はお休み'; d.reason='痛みがあったため、次回はこの種目を休みます';
      } else {
        d.code='pain'; d.label='痛みのため据え置き'; d.reason='痛みがあったため負荷を上げません。次回は可動域を小さくして様子を見ます';
      }
      return d;
    }

    // --- W：使用重量を予定から変えた → 実際にできた回数を次回目標に ---
    if(v.loaded && r.load!=null && r.plannedLoad!=null && +r.load!==+r.plannedLoad){
      let t=clamp(minA||T, v.repMin, v.repMax);
      if(t>T && (r.form!=='good' || r.pain==='discomfort')) t=T;
      d.rule='W'; d.code='weight'; d.label='重量変更'; d.to.target=t;
      d.reason=`使用重量を${fmtKg(r.plannedLoad)}→${fmtKg(r.load)}に変えたため、実際の回数（最少${minA}${u}）を基準に次回${t}${u}`;
      return d;
    }

    // --- G：フォーム不良・違和感 → 上げない ---
    let cap='';
    if(next>T){
      if(r.form!=='good'){ next=T; d.rule+='+G'; d.code='form'; cap= r.form==='bad'?'フォームが崩れたため':'フォームが少し崩れたため'; }
      else if(r.pain==='discomfort'){ next=T; d.code='discomfort'; cap='違和感があったため'; }
    }

    // --- 難易度アップ判定（上限回数を安定して達成） ---
    const eligible= allHit && r.form==='good' && r.pain==='none' && r.feel<=2 && minA>=v.repMax && r.status==='done';
    if(eligible){
      d.topCount=st.topCount+1; d.to.target=v.repMax;
      const hIdx=this.harder(ex,r.level), canW=!!v.wp;
      if(hIdx<0 && !canW){ d.code='max'; d.label='最上位で継続'; d.reason=`最上位バリエーションの上限${v.repMax}${u}に到達。このまま維持します`; }
      else if(d.topCount>=2 || (calib && r.feel===1)){
        d.code='levelup'; d.levelUpReady=true; d.label='難易度アップ提案';
        d.reason=`上限${v.repMax}${u}を余裕を持って達成（${d.topCount}回目）。${canW?'重量アップか次の段階へ':'次の難易度へ'}進めそうです`;
      } else { d.code='top'; d.label='上限到達'; d.reason=`上限${v.repMax}${u}を余裕を持って達成。次回も同様なら難易度アップを提案します`; }
      if(calib) d.reason='調整期間：'+d.reason;
      return d;
    }

    // --- 下限を下回る → やさしいvariationへ（大きく未達 or 調整期間のみ） ---
    if(next<v.repMin){
      const e=this.easier(ex,r.level);
      if(e>=0 && (d.rule.startsWith('F') || calib)){
        const ev=ex.variations[e];
        d.to={level:e, target:Math.min(ev.repMax, ev.repMin+2*step)}; d.code='leveldown'; d.label='難易度ダウン';
        d.reason=raw+`、目標範囲の下限を下回るため${ev.name}へ`;
        if(calib) d.reason='調整期間：'+d.reason;
        return d;
      }
      next=v.repMin;
    }

    d.to.target=next;
    const diff=next-T;
    if(cap){ d.label= d.code==='form'?'フォーム優先のため据え置き':'違和感のため据え置き'; d.reason=cap+'回数を上げずに据え置き'; }
    else if(diff>0){ d.code='up'; d.label=`前回より+${diff}`; d.reason=raw+`次回+${diff}${u}`; }
    else if(diff<0){ d.code='down'; d.label=`前回より−${-diff}`; d.reason=raw+`次回−${-diff}${u}`; }
    else { d.code='hold'; d.label='据え置き'; d.reason=raw+'同じ回数で継続'; }
    if(calib) d.reason='調整期間：'+d.reason;
    return d;
  },

  apply(r, d){
    const ex=EX[r.exerciseId], st=this.state(r.exerciseId);
    const before=ex.variations[st.level];
    st.sessions++; st.topCount=d.topCount; st.levelUpReady=!!d.levelUpReady;
    this.setLevel(st,ex,d.to.level); st.target=d.to.target;
    // 重量・メモは入力どおりに保存（空欄は null／"" にして古い値を残さない）
    if(before.loaded){ st.load=(r.load!=null&&r.load!=='')?+r.load:null; st.loadLabel=r.loadLabel||''; }
    const after=ex.variations[st.level];
    if(after!==before && !this.sameEquip(before,after)){ st.load=after.defaultLoad!=null?after.defaultLoad:null; st.loadLabel=''; }
    st.last={date:ymd(), variationId:r.variationId, level:r.level, target:r.target, variationName:r.variationName,
      reps:r.sets.map(s=>s.done?s.reps:0), feel:r.feel, form:r.form, pain:r.pain, status:r.status, load:r.load};
    st.lastDecision=d;
    if(r.pain==='pain') st.painNote= PAIN_ACTION[r.painAction||'rom'];
    else if(r.pain==='none') st.painNote=null;
    if(d.code==='rest') st.skipNext=true;
    if(d.code==='swap' && d.swapTo) S.subs[r.slotId]=d.swapTo;
    // 痛みの連続回数（実施した回のみ。スキップ・休止は数えない／「違和感」は含めない）
    st.painStreak= r.pain==='pain' ? (st.painStreak||0)+1 : 0;
    if(st.painStreak>=2){
      st.pausedByPain=true; d.paused=true; d.code='paused'; d.label='一時休止';
      d.reason+='。同じ種目で2回続けて痛みが記録されたため、通常メニューから一旦外します';
    }
  },
  /* 痛みによる一時休止から、ユーザーの明示的な操作で再開 */
  resumeFromPause(id){
    const st=this.state(id);
    st.pausedByPain=false; st.painStreak=0; st.skipNext=false;
    st.painNote='休止から再開した直後です。可動域を小さめにし、痛みが出たら中止してください';
    st.lastDecision={code:'resumed', label:'再開', rule:'', reason:'痛みによる一時休止から再開しました。回数は据え置きです',
      to:{level:st.level, variationId:st.variationId, target:st.target}};
    if(S.subs[id]) delete S.subs[id];   // 代替に切り替えていた場合は元の種目に戻す
  },

  acceptLevelUp(id){
    const ex=EX[id], st=this.state(id), h=this.harder(ex,st.level); if(h<0) return;
    const from=ex.variations[st.level], to=ex.variations[h];
    this.setLevel(st,ex,h); st.target=to.repMin; st.topCount=0; st.levelUpReady=false;
    if(!this.sameEquip(from,to)) st.load=to.defaultLoad!=null?to.defaultLoad:null;
    st.lastDecision=Object.assign({}, st.lastDecision||{}, {code:'levelup_done', label:'難易度アップ', to:{level:h,variationId:to.id,target:to.repMin},
      reason:`${from.name} → ${to.name}。目標は範囲の下限${to.repMin}${ex.unit}から`});
  },
  acceptWeightUp(id, kg){
    const ex=EX[id], st=this.state(id), v=ex.variations[st.level]; const old=st.load;
    st.load=+kg; st.target=v.repMin; st.topCount=0; st.levelUpReady=false;
    st.lastDecision=Object.assign({}, st.lastDecision||{}, {code:'weightup', label:'重量アップ', to:{level:st.level,variationId:v.id,target:v.repMin},
      reason:`${old!=null?fmtKg(old)+' → ':''}${fmtKg(kg)}。目標は範囲の下限${v.repMin}${ex.unit}から`});
  },
  declineLevelUp(id){
    const ex=EX[id], st=this.state(id); st.levelUpReady=false; st.topCount=0;
    st.lastDecision=Object.assign({}, st.lastDecision||{}, {code:'hold', label:'上限で継続', reason:`難易度は据え置き。上限${ex.variations[st.level].repMax}${ex.unit}で続けます`});
  }
};
function fmtKg(x){ return (x==null||x==='')?'':(Math.round(+x*10)/10)+'kg'; }

/* =========================================================
   5. PLAN — 今日のメニュー生成
   ========================================================= */
function condLevel(c){
  if(!c) return 0;
  const mild=(c.sleep==='bad'?1:0)+(c.soreness==='strong'?1:0);
  if(c.fatigue==='high' || mild>=2) return 2;   // 控えめ：上げない＋セット−1＋短縮提案
  if(mild===1) return 1;                        // 上げない
  return 0;
}
/* 所要時間の推定：休憩タイマーと同じ restSec を使う（休憩は各セットの間だけ＝セット数−1回） */
function estSec(it){
  const ex=EX[it.exerciseId]; const work= ex.type==='time'? it.target : it.target*3.5; const sides=it.perSide?2:1;
  const rest=it.restSec||ex.restSec;
  return it.sets*(work*sides+(it.perSide?10:0)) + Math.max(0,it.sets-1)*rest + 60;
}
function estimate(items){ return 120+items.filter(i=>i.state==='todo'&&!i.optional).reduce((a,i)=>a+estSec(i),0); }
function roundMin(sec){ return Math.max(5, Math.round(sec/60/5)*5); }
function daySlotsOf(tpl){ return tpl?tpl.slots.concat(tpl.optional||[]):[]; }
/* 明日が他の運動の日なら、その強度（light/normal/hard）。違えば null */
function sportIntensityFor(wd){
  if(!(S.settings.sportDays||[]).includes(wd)) return null;
  return (S.settings.sportIntensity||{})[wd]||'normal';
}

const Plan = {
  template(){ const list=TEMPLATES[S.settings.freq]; return list[S.rotation%list.length]; },
  templateByKey(freq,key){ return (TEMPLATES[freq]||[]).find(t=>t.key===key); },
  /* 1スロット分のメニュー項目。ctx = {cl:コンディション段階, sportInt:翌日の運動強度, sport:運動名} */
  makeItem(tpl, slot, idx, r, ctx){
    const ex=EX[r.id], st=Engine.state(r.id), v=ex.variations[st.level];
    const baseSets=Math.min(Engine.setsOf(ex,st)+((S.settings.duration==='long'&&ex.priority<=2)?1:0), 4);
    const it={slotId:slot, exerciseId:r.id, subReason:r.reason, order:idx, optional:(tpl.optional||[]).includes(slot),
      level:st.level, variationId:v.id, variationName:v.name, target:st.target, baseSets, sets:baseSets, unit:ex.unit,
      perSide:(v.perSide!=null?v.perSide:ex.perSide), loaded:v.loaded, load:v.loaded?st.load:null, loadLabel:v.loaded?(st.loadLabel||''):'',
      restSec:Engine.restOf(ex,st), condAdj:false, sportAdj:false, notes:[], state:'todo', result:null};
    if(st.pausedByPain){ it.state='paused'; return it; }
    if(st.skipNext){ it.state='rest'; return it; }
    const capTarget=()=>{ if(st.last && st.last.variationId===st.variationId && it.target>st.last.target){ it.target=st.last.target; return true; } return false; };
    if(ctx.cl>=1){ it.condAdj=true; if(capTarget()) it.notes.push('今日は前回と同じ回数（負荷を上げない）'); }
    if(ctx.cl>=2 && it.sets>2){ it.sets--; it.notes.push('コンディションに合わせて1セット減'); }
    if(ctx.sportInt && ctx.sportInt!=='light' && ex.tags.some(t=>t==='legs'||t==='shoulder')){
      it.sportAdj=true; capTarget();
      const parts=['回数を上げない']; if(ctx.sportInt==='hard' && it.sets>2){ it.sets--; parts.push('セット−1'); }
      it.notes.push(`明日${ctx.sport}（${SPORT_INT[ctx.sportInt]}）のため控えめ：${parts.join('・')}`);
    }
    return it;
  },
  build(opts){
    opts=opts||{};
    const tpl=this.template(), cl=condLevel(opts.condition), all=daySlotsOf(tpl);
    const sport=S.settings.sportName||'他の運動';
    const sportInt=sportIntensityFor((new Date().getDay()+1)%7);
    const ctx={cl, sportInt, sport};
    const notes=[];
    if(cl===1) notes.push('今日は負荷を上げず、前回と同じ回数で行います');
    if(cl===2) notes.push('今日は負荷を上げず、各種目のセット数を1つ減らします');
    if(sportInt==='light') notes.push(`明日は${sport}（軽め）の予定です。筋トレの調整はしません`);
    else if(sportInt==='normal') notes.push(`明日は${sport}（通常）の予定です。脚・肩の種目は回数を上げません`);
    else if(sportInt==='hard') notes.push(`明日は${sport}（高強度・試合）の予定です。脚・肩の種目は回数を上げず、1セット減らします`);
    const items=[];
    all.forEach((slot,idx)=>{
      const r=Engine.resolve(slot,all); if(!r) return;
      items.push(this.makeItem(tpl, slot, idx, r, ctx));
    });
    if(opts.short){
      items.forEach(i=>{ if(i.optional && i.state==='todo') i.state='omitted'; });
      const act=items.filter(i=>i.state==='todo');
      if(act.length>3){
        const keep=act.slice().sort((a,b)=>EX[a.exerciseId].priority-EX[b.exerciseId].priority||a.order-b.order).slice(0,3);
        act.forEach(i=>{ if(!keep.includes(i)) i.state='omitted'; });
      }
      const kept=items.filter(i=>i.state==='todo').sort((a,b)=>EX[b.exerciseId].priority-EX[a.exerciseId].priority);
      for(const i of kept){ if(estimate(items)<=20*60) break; if(i.sets>2){ i.sets--; i.notes.push('短縮モードでセット−1'); } }
    }
    return {tpl, items, notes, sportEve:!!sportInt, sportInt, ctx, condLevel:cl, estMin:roundMin(estimate(items))};
  }
};

/* =========================================================
   5b. ANALYTICS — 停滞候補・週間セット数（情報表示のみ。自動調整には使わない）
   ========================================================= */
/* 比較可能（progressEligible===true）な直近3回で、目標・バリエーション・重量のどれも伸びていなければ停滞候補 */
function stallInfo(id){
  const ex=EX[id]; if(!ex) return null;
  const st=S.exercises[id]; if(!st) return null;
  const rows=[];
  S.sessions.forEach(ses=>(ses.exercises||[]).forEach((r,k)=>{ if(r.exerciseId===id && r.status!=='skipped') rows.push({sid:ses.id+':'+k, date:ses.date, r}); }));
  const el=rows.filter(x=>x.r.progressEligible===true);
  if(el.length<3) return null;
  const last3=el.slice(-3), [a,b,c]=last3.map(x=>x.r);
  const L=x=>(x==null||x==='')?null:+x;
  if(!(a.variationId===b.variationId && b.variationId===c.variationId)) return null;
  if(!(L(a.load)===L(b.load) && L(b.load)===L(c.load))) return null;
  const d=c.decision||{}, next=d.to||{};
  if(['top','levelup','max','levelup_done','weightup'].includes(d.code)) return null;   // 上限到達での据え置きは停滞ではない
  if(next.variationId && next.variationId!==c.variationId) return null;
  if(st.variationId!==c.variationId || L(st.load)!==L(c.load)) return null;              // その後に変更済み
  const maxT=Math.max(b.target, c.target, next.target!=null?next.target:c.target, st.target);
  if(maxT>a.target) return null;
  const key=last3[2].sid;
  return {key, acked:st.stallAck===key, rows:last3};
}
function weeklySets(){
  const ws=ymd(weekStart(new Date()));
  const cnt={push:0,pull:0,legs:0,core:0,shoulder:0};
  const add=r=>{ if(!r||r.status==='skipped') return; const ex=EX[r.exerciseId]; if(!ex) return;
    const g=SET_GROUP[ex.category]; if(!g) return;
    cnt[g]+=(r.sets||[]).filter(x=>x.done && (+x.reps||0)>0).length; };   // 左右種目も「左右で1セット」
  S.sessions.filter(ses=>ses.date>=ws).forEach(ses=>(ses.exercises||[]).forEach(add));
  if(S.active && S.active.date>=ws) S.active.items.forEach(it=>add(it.result));
  return cnt;
}

function movedNotice(){
  const days=S.settings.days||[]; if(!days.length) return false;
  const last=S.sessions.length?S.sessions[S.sessions.length-1].date:(S.settings.createdAt||ymd());
  const today=new Date();
  for(let i=1;i<=7;i++){ const d=addDays(today,-i), ds=ymd(d); if(ds<=last) break; if(days.includes(d.getDay())) return true; }
  return false;
}
function nextPlannedText(){
  const days=S.settings.days||[]; const t=new Date();
  if(days.includes(t.getDay())) return '今日は予定日です';
  for(let i=1;i<=7;i++){ const d=addDays(t,i); if(days.includes(d.getDay())) return `次の予定日：${WD[d.getDay()]}曜（予定日以外でも始められます）`; }
  return '予定曜日は未設定です';
}
function weekCount(){ const ws=ymd(weekStart(new Date())); return S.sessions.filter(s=>s.date>=ws).length; }

/* =========================================================
   6. SESSION — 実施の流れ
   ========================================================= */
const Session = {
  begin(cond, short){
    const p=Plan.build({condition:cond, short});
    S.active={id:'s'+Date.now(), date:ymd(), startedAt:Date.now(), dayKey:p.tpl.key, dayLabel:p.tpl.label, daySub:p.tpl.sub,
      freq:S.settings.freq, mode:short?'short':'normal', condition:Object.assign({},cond), condLevel:p.condLevel,
      sportEve:p.sportEve, sportInt:p.sportInt, ctx:p.ctx, notes:p.notes, estMin:p.estMin, items:p.items, draft:null, rest:null};
    save();
  },
  daySlots(){ return daySlotsOf(Plan.templateByKey(S.active.freq,S.active.dayKey)); },
  /* 次の未実施種目。必須を先に、任意種目は含めない（任意はメニューから選ぶ） */
  nextTodo(after){
    const its=S.active.items, ok=i=>its[i].state==='todo' && !its[i].optional;
    for(let i=after+1;i<its.length;i++) if(ok(i)) return i;
    for(let i=0;i<its.length;i++) if(ok(i)) return i;
    return -1;
  },
  optionalLeft(){ return S.active.items.some(i=>i.state==='todo'&&i.optional); },
  snapshot(it){
    it.prevState=JSON.parse(JSON.stringify(Engine.state(it.exerciseId)));
    it.prevSub={slot:it.slotId, had:Object.prototype.hasOwnProperty.call(S.subs,it.slotId), value:S.subs[it.slotId]};
  },
  restore(it){
    if(it.prevState) S.exercises[it.exerciseId]=it.prevState;
    const p=it.prevSub;
    if(p){ if(p.had) S.subs[p.slot]=p.value; else delete S.subs[p.slot]; }   // この種目のスロットだけ戻す
    it.prevState=null; it.prevSub=null;
  },
  record(i, dr, status){
    const it=S.active.items[i], ex=EX[it.exerciseId];
    const anyChecked=dr.sets.some(s=>s.done);
    const loadVal= it.loaded && dr.load!=='' && dr.load!=null && !isNaN(+dr.load) ? +dr.load : null;
    const r={exerciseId:it.exerciseId, slotId:it.slotId, exerciseName:ex.name, variationId:it.variationId, level:it.level, variationName:it.variationName,
      target:it.target, plannedSets:it.sets, unit:it.unit, perSide:it.perSide, optional:!!it.optional,
      load:loadVal, plannedLoad:it.loaded?it.load:null, loadLabel:it.loaded?(dr.loadLabel||'').trim():'',
      sets:dr.sets.map((s,k)=>({index:k+1, reps:(anyChecked&&!s.done)?0:(+s.reps||0), done:anyChecked?s.done:true})),
      feel:dr.feel, form:dr.form, pain:dr.pain, painAction:dr.pain==='pain'?dr.painAction:null, memo:dr.memo.trim(), status};
    if(status==='stopped' && !anyChecked){ r.sets.forEach(s=>{ s.done=false; s.reps=0; }); }
    const st=Engine.state(it.exerciseId);
    // 停滞判定に使ってよい記録か（同じvariation・同じ重量・通常条件・通常セット数・フォーム良好・痛みなし）
    const ex_=[], A=S.active, prev=st.lastDecision||{};
    if(A.mode==='short') ex_.push('short');
    if((A.condLevel||0)>=1 || it.condAdj) ex_.push('condition');
    if(it.sportAdj) ex_.push('sport');
    if(it.baseSets!=null && it.sets<it.baseSets) ex_.push('reducedSets');
    if(status!=='done') ex_.push('stopped');
    if(r.pain==='pain') ex_.push('pain');
    if(r.pain==='discomfort') ex_.push('discomfort');
    if(r.form!=='good') ex_.push('form');
    const L=x=>(x==null||x==='')?null:+x;
    if(it.loaded && (L(r.load)!==L(r.plannedLoad) || (st.last && st.last.variationId===it.variationId && L(st.last.load)!==L(r.load)))) ex_.push('weight');
    if(st.last && st.last.variationId!==it.variationId) ex_.push('newVariation');
    if(prev.code==='manual') ex_.push('manual');
    if(prev.code==='resumed') ex_.push('resumed');
    r.excludeReasons=ex_; r.progressEligible=ex_.length===0;
    this.snapshot(it);
    const d=Engine.evaluate(ex, st, r, this.daySlots());
    Engine.apply(r,d); r.decision=d; it.result=r; it.state='done';
    A.draft=null; A.rest=null;
    save(); return d;
  },
  skip(i){
    const it=S.active.items[i];
    it.result={exerciseId:it.exerciseId, slotId:it.slotId, exerciseName:EX[it.exerciseId].name, variationId:it.variationId, level:it.level, variationName:it.variationName,
      target:it.target, plannedSets:it.sets, unit:it.unit, perSide:it.perSide, optional:!!it.optional, sets:[], status:'skipped', feel:null, form:null, pain:null, memo:'',
      progressEligible:false, excludeReasons:['stopped']};
    it.state='skipped'; S.active.draft=null; S.active.rest=null; save();
  },
  /* 痛みで一時休止中の種目への対応（今回は休む／代替を使う／確認して再開） */
  pauseSkip(i){ S.active.items[i].pauseAck=true; save(); },
  useAlt(i){
    const A=S.active, it=A.items[i];
    const alt=Engine.pickAlt(it.slotId, it.exerciseId, this.daySlots()); if(!alt) return null;
    S.subs[it.slotId]=alt;
    const tpl=Plan.templateByKey(A.freq,A.dayKey)||{slots:[],optional:[]};
    const ni=Plan.makeItem(tpl, it.slotId, it.order, {id:alt, reason:'sub'}, A.ctx||{cl:A.condLevel||0});
    A.items.splice(i,1,ni); save(); return alt;
  },
  resumePaused(i){
    const A=S.active, it=A.items[i];
    Engine.resumeFromPause(it.exerciseId);
    const tpl=Plan.templateByKey(A.freq,A.dayKey)||{slots:[],optional:[]};
    const ni=Plan.makeItem(tpl, it.slotId, it.order, {id:it.exerciseId, reason:it.subReason}, A.ctx||{cl:A.condLevel||0});
    A.items.splice(i,1,ni); save();
  },
  undo(i){
    const it=S.active.items[i];
    this.restore(it); it.result=null; it.state='todo'; save();
  },
  finish(){
    const A=S.active; const recorded=A.items.filter(it=>it.result);
    const done=recorded.filter(it=>it.result.status!=='skipped');
    let sid=null;
    if(done.length){
      const end=Date.now();
      const session={id:A.id, date:A.date, startedAt:A.startedAt, endedAt:end, durationMin:Math.max(1,Math.round((end-A.startedAt)/60000)),
        dayKey:A.dayKey, dayLabel:A.dayLabel, daySub:A.daySub, freq:A.freq, mode:A.mode, condition:A.condition, notes:A.notes,
        exercises:recorded.map(it=>it.result)};
      S.sessions.push(session); S.rotation++; sid=session.id;
      A.items.filter(it=>it.state==='rest').forEach(it=>{ const st=S.exercises[it.exerciseId]; if(st) st.skipNext=false; });
    }
    S.active=null; save(); return sid;
  },
  discard(){
    S.active.items.slice().reverse().forEach(it=>this.restore(it));
    S.active=null; save();
  }
};

function chipClass(code){

/* ---------- 開始値・現在の目標エディタ（初回設定＝開始値、設定画面＝現在の目標を手動変更） ---------- */
function goalBase(id, mode){
  if(mode==='setup') return Engine.defaultGoal(id, UI.sd.experience, UI.sd.equipment);
  const ex=EX[id], st=Engine.state(id);
  return {variationId:st.variationId, target:st.target, sets:Engine.setsOf(ex,st), rest:Engine.restOf(ex,st), load:st.load};
}
function goalOf(id, mode){ return Object.assign({}, goalBase(id,mode), UI.goalEdits[id]||{}); }
function finalGoal(id, mode){
  const ex=EX[id], eq=UI.sd.equipment, g=goalOf(id,mode);
  let i=Engine.idx(ex,g.variationId);
  if(i<0||!Engine.avail(ex,ex.variations[i],eq)) i=Math.max(0,Engine.fitLevel(ex,Math.max(i,0),eq));
  const v=ex.variations[i];
  return {variationId:v.id, i, v, target:clamp(+g.target||v.repMin,v.repMin,v.repMax), sets:+g.sets||ex.sets, rest:+g.rest||ex.restSec,
    load:(g.load===''||g.load==null||isNaN(+g.load))?null:+g.load};
}
function goalOrder(){
  const seen=[]; [2,3].forEach(f=>TEMPLATES[f].forEach(t=>daySlotsOf(t).forEach(x=>{ if(!seen.includes(x)) seen.push(x); })));
  Object.keys(EX).forEach(x=>{ if(!seen.includes(x)) seen.push(x); });
  const cur=[]; TEMPLATES[UI.sd.freq].forEach(t=>daySlotsOf(t).forEach(x=>{ if(!cur.includes(x)) cur.push(x); }));
  return cur.concat(seen.filter(x=>!cur.includes(x)));
}
function goalEditorHTML(mode){
  const eq=UI.sd.equipment;
  return goalOrder().map(id=>{
    const ex=EX[id];
    if(!Engine.anyAvail(ex,eq)) return `<div class="goal muted small"><strong>${h(ex.name)}</strong>：器具がないため代替種目で行います</div>`;
    const g=finalGoal(id,mode), i=g.i, v=g.v, step=Engine.stepOf(ex), edited=!!UI.goalEdits[id];
    const opts=ex.variations.map((x,k)=>Engine.avail(ex,x,eq)?`<option value="${x.id}" ${k===i?'selected':''}>${h(x.name)}（${x.repMin}〜${x.repMax}${ex.unit}）</option>`:'').join('');
    const inUse=TEMPLATES[UI.sd.freq].some(t=>daySlotsOf(t).includes(id));
    return `<div class="goal stack-s" id="goal-${id}">
      <div class="row between"><strong>${h(ex.name)}</strong><span class="row" style="gap:6px">${edited?'<span class="chip info">変更あり</span>':''}${inUse?'':'<span class="chip">代替用</span>'}</span></div>
      <select id="gv-${id}" data-in="goalvar" data-id="${id}" aria-label="${h(ex.name)}のバリエーション">${opts}</select>
      <div class="goal-grid">
        <div class="field"><span class="label">目標（${(v.perSide!=null?v.perSide:ex.perSide)?'各側・':''}${ex.unit}）</span>
          <div class="stepper sm"><button type="button" data-act="goalstep" data-id="${id}" data-d="-${step}" aria-label="${h(ex.name)}の目標を減らす">−</button>
          <input type="number" inputmode="numeric" id="gt-${id}" data-in="goaltarget" data-id="${id}" value="${g.target}" aria-label="${h(ex.name)}の目標">
          <button type="button" data-act="goalstep" data-id="${id}" data-d="${step}" aria-label="${h(ex.name)}の目標を増やす">＋</button></div></div>
        <div class="field"><span class="label">セット</span>${segHTML('goalsets',id,[[2,'2'],[3,'3'],[4,'4']],g.sets)}</div>
      </div>
      <div class="field"><span class="label">セット間の休憩（秒）</span>${segHTML('goalrest',id,[[60,'60'],[90,'90'],[120,'120'],[150,'150']],g.rest)}</div>
      ${v.loaded?`<div class="field"><span class="label">使用重量（kg・任意）</span><input type="number" inputmode="decimal" step="0.5" min="0" id="gl-${id}" data-in="goalload" data-id="${id}" value="${g.load!=null?g.load:''}" placeholder="例：8"></div>`:''}
    </div>`;
  }).join('');
}

    <div><strong>判定：${h(d.label)}</strong>${d.rule?` <span class="small muted">（ルール${h(d.rule)}）</span>`:''}</div>
    <div class="small">${h(d.reason)}</div></div></details>`;
}
function levelUpPanel(id){
  const ex=EX[id], st=Engine.state(id); if(!st.levelUpReady) return '';
  const v=ex.variations[st.level], hIdx=Engine.harder(ex,st.level), canW=!!v.wp;
  if(hIdx<0 && !canW) return '';
  const to=hIdx>=0?ex.variations[hIdx]:null;
  const nextKg= UI.lvLoad[id]!=null ? UI.lvLoad[id] : (st.load!=null ? Math.round((st.load+v.loadStep)*10)/10 : '');
  const wBlock= canW ? `<div class="stack-s"><span class="small"><strong>重量を上げる</strong>：${h(v.name)}のまま、${v.repMin}${ex.unit}から再スタート</span>
      <div class="row" style="flex-wrap:nowrap"><input type="number" inputmode="decimal" step="0.5" min="0" id="lv-${id}" data-in="lvload" data-id="${id}" value="${nextKg}" aria-label="新しい重量（kg）" placeholder="kg" style="font:inherit;font-size:16px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100px;background:var(--surface);color:var(--ink)"><span>kg</span>
      <button type="button" class="btn btn-sm btn-primary" data-act="weightup" data-id="${id}" style="flex:1">この重量で進む</button></div>
      ${st.load!=null?`<span class="small muted">現在 ${fmtKg(st.load)}。これより重い値のみ「重量アップ」にできます</span>`:''}
      ${UI.lvErr&&UI.lvErr[id]?`<p class="error" role="alert">${h(UI.lvErr[id])}</p>`:''}</div>` : '';
  const vBlock= to ? `<div class="stack-s"><span class="small"><strong>次の段階へ</strong>：${h(to.name)}（${to.repMin}〜${to.repMax}${ex.unit}）、${to.repMin}${ex.unit}から</span>
      <button type="button" class="btn btn-sm ${canW?'':'btn-primary'}" data-act="levelup" data-id="${id}">次の段階へ進む</button></div>` : '';
  return `<div class="note info stack"><strong>次の難易度へ進めそうです</strong>
    ${wBlock}${vBlock}
    <button type="button" class="btn btn-sm" data-act="leveldecline" data-id="${id}">今のまま続ける</button></div>`;
}

function renderToday(){
  const A=S.active; if(!A) return renderHome();
  const cards=A.items.map((it,i)=>{
    const ex=EX[it.exerciseId], st=Engine.state(it.exerciseId), v=ex.variations[it.level];
    if(it.state==='paused'){
      if(it.pauseAck) return `<div class="card is-rest small"><strong>${h(ex.name)}</strong> — 痛みのため一時休止中。今回は休みます。再開は設定画面からもできます。</div>`;
      const alt=Engine.pickAlt(it.slotId, it.exerciseId, Session.daySlots());
      return `<div class="card stack" style="border-color:var(--danger)">
        <div class="ex-head"><h3>${h(ex.name)}</h3><span class="chip pain">一時休止中</span></div>
        ${pauseWarningHTML()}
        ${UI.resumeConfirm===it.exerciseId ? resumeConfirmHTML('pauseresume',`data-i="${i}"`) : `<div class="stack-s">
          <button type="button" class="btn" data-act="pauseskip" data-i="${i}">今回は休む</button>
          <button type="button" class="btn" data-act="pausealt" data-i="${i}" ${alt?'':'disabled'}>${alt?`代替種目を使う（${h(EX[alt].name)}）`:'代替種目を使う（候補なし）'}</button>
          <button type="button" class="btn" data-act="pauseresumeask" data-id="${it.exerciseId}">状態を確認したうえで再開する</button>
          <button type="button" class="btn-link" data-act="form" data-id="${it.exerciseId}" data-vid="${it.variationId}">フォームを見る</button></div>`}
      </div>`;
    }
    if(it.state==='rest') return `<div class="card is-rest small"><strong>${h(ex.name)}</strong> — 今回はお休み（前回の痛みのため）。次回から再開します。</div>`;
    if(it.state==='omitted') return '';
    const sub= it.subReason?`<span class="chip info">${h(EX[it.slotId].name)}の代わり${it.subReason==='equip'?'（器具）':''}</span>`:'';
    const calib= st.sessions<2 && !it.result ? `<span class="chip info">調整期間</span>`:'';
    const opt= it.optional?`<span class="chip">任意</span>`:'';
    if(it.result){
      const r=it.result, d=r.decision;
      return `<div class="card is-done stack-s">
        <div class="ex-head"><h3>${h(ex.name)}</h3>${r.status==='skipped'?'<span class="chip">スキップ</span>':decisionChip(d)}</div>
        ${r.status!=='skipped'?`<div class="done-line"><span class="check" aria-hidden="true">✓</span><span class="num" style="font-size:20px;font-weight:600">${repsText(r.sets.map(s=>s.reps))}</span>
          ${r.load!=null?loadTag(r.load):''}
          <span class="muted small">${r.status==='stopped'?'途中で中止':h(FEEL[r.feel]||'')}${r.pain!=='none'?'・'+h(PAIN[r.pain]):''}</span></div>
          <p class="small muted">${h(d.reason)}</p>`:''}
        ${levelUpPanel(it.exerciseId)}
        <div><button type="button" class="btn-link small" data-act="undo" data-i="${i}">記録を取り消す</button></div>
      </div>`;
    }
    return `<div class="card stack">
      <div class="ex-head"><div><h3>${h(ex.name)}</h3><div class="ex-var">${h(v.name)}${v.tempo?`・${h(v.tempo)}`:''}</div></div>
        <div class="row" style="gap:6px;justify-content:flex-end">${opt}${calib}${sub}${decisionChip(st.lastDecision)}</div></div>
      <div class="target-grid">
        <div><span class="label">今日</span><div class="target-big">${it.perSide?'<span class="u" style="margin:0 4px 0 0">各側</span>':''}${it.target}<span class="u">${it.unit}</span><span class="x">×</span>${it.sets}<span class="u">セット</span></div>
          ${it.loaded?`<div style="margin-top:6px">${it.load!=null?loadTag(it.load,it.loadLabel):'<span class="small muted">重量は記録時に入力</span>'}</div>`:''}</div>
        <div><span class="label">前回</span>${prevLine(st,it)}</div>
      </div>
      ${it.optional?`<p class="small muted">補助種目です。時間と体力に余裕があれば行ってください。</p>`:''}
      ${it.notes.map(n=>`<div class="note warn">${h(n)}</div>`).join('')}
      ${st.painNote?`<div class="note pain">前回は痛みあり：${h(st.painNote)}。無理をせず、痛みが出たら中止してください。</div>`:''}
      ${levelUpPanel(it.exerciseId)}
      ${logicHTML(st,ex)}
      <div class="btn-row">
        <button type="button" class="btn" data-act="form" data-id="${ex.id}" data-vid="${it.variationId}">フォームを見る</button>
        <button type="button" class="btn btn-primary" data-act="openex" data-i="${i}" aria-label="${h(ex.name)}を開始">開始</button>
      </div></div>`;
  }).join('');
  const omitted=A.items.filter(i=>i.state==='omitted');
  const hasTodo=A.items.some(i=>i.state==='todo'&&!i.optional);
  const anyDone=A.items.some(i=>i.result);
  return `<div class="wrap no-tab stack">
    <div class="topbar"><button type="button" class="btn-link" data-act="nav" data-to="home">← ホーム</button>
      <span class="small muted">途中で閉じても続きから再開できます</span></div>
    <div class="stack-s">
      <h2>${h(A.dayLabel)} <span class="muted" style="font-size:16px">${h(A.daySub)}</span></h2>
      <div class="row"><span class="chip">約${A.estMin}分</span>${A.mode==='short'?'<span class="chip info">短縮モード</span>':''}</div>
      ${A.notes.map(n=>`<div class="note info">${h(n)}</div>`).join('')}
    </div>
    ${UI.msg?`<div class="toast" role="status">${h(UI.msg)}</div>`:''}
    ${cards}
    ${omitted.length?`<p class="small muted">短縮モードで省略：${omitted.map(i=>h(EX[i.exerciseId].name)).join('・')}</p>`:''}
    ${hasTodo?`<button type="button" class="btn btn-primary btn-hero" data-act="continue">${anyDone?'次の種目へ':'1種目目から始める'}</button>`:''}
    <button type="button" class="btn btn-block ${hasTodo?'':'btn-primary btn-hero'}" data-act="finish">トレーニングを終える</button>
    ${UI.confirmDiscard
      ? `<div class="card stack-s"><p>この回の記録をすべて取り消して終了しますか？次回目標も元に戻ります。</p>
         <div class="btn-row"><button type="button" class="btn btn-danger-solid" data-act="discardyes">取り消して終了</button><button type="button" class="btn" data-act="discardno">戻る</button></div></div>`
      : `<button type="button" class="btn-link" style="color:var(--muted)" data-act="discardask">記録せずに中止する</button>`}
  </div>`;
}

function renderExercise(){
  const A=S.active; const it=A&&A.items[UI.i]; if(!it) return renderToday();
  const ex=EX[it.exerciseId], st=Engine.state(it.exerciseId), v=ex.variations[it.level], dr=UI.draft;
  const step=Engine.stepOf(ex);
  const pos=A.items.filter(x=>x.state!=='omitted'&&x.state!=='rest'&&x.state!=='paused'); const idx=pos.indexOf(it)+1;
  const anyChecked=dr.sets.some(s=>s.done);
  const sets=dr.sets.map((s,k)=>`<div class="setrow">
      <span class="setno">セット${k+1}</span>
      <div class="stepper"><button type="button" data-act="rep" data-s="${k}" data-d="-${step}" aria-label="セット${k+1}を${step}減らす">−</button>
        <input type="number" inputmode="numeric" pattern="[0-9]*" id="rep${k}" data-in="rep" data-s="${k}" value="${s.reps}" aria-label="セット${k+1}の${ex.type==='time'?'秒数':'回数'}">
        <button type="button" data-act="rep" data-s="${k}" data-d="${step}" aria-label="セット${k+1}を${step}増やす">＋</button></div>
      <button type="button" class="setcheck" data-act="checkset" data-s="${k}" aria-pressed="${s.done}" aria-label="セット${k+1}完了">✓</button>
    </div>`).join('');
  const feel=[1,2,3,4,5].map(n=>`<button type="button" class="opt" data-act="feel" data-val="${n}" aria-pressed="${dr.feel===n}"><span class="n">${n}</span>${FEEL[n]}</button>`).join('');
  let painPanel='';
  if(dr.pain==='pain'){
    const canEasier=Engine.easier(ex,it.level)>=0;
    const alt=Engine.pickAlt(it.slotId, ex.id, Session.daySlots());
    const opts=[['rom',PAIN_ACTION.rom,true],['easier',PAIN_ACTION.easier,canEasier],['swap',alt?`代替種目に変更（${EX[alt].name}）`:'代替種目に変更（候補なし）',!!alt],['rest',PAIN_ACTION.rest,true]];
    painPanel=`<div class="note pain stack-s" role="alert"><strong>痛みがある場合、負荷は上げません</strong>
      ${(st.painStreak||0)>=1?`<span><strong>前回もこの種目で痛みが記録されています。</strong>今回も「痛みあり」で記録すると、この種目は通常メニューから一旦外れます（一時休止）。</span>`:''}
      <span>次回の扱いを選んでください。痛みが強い・続く場合はこの種目を中止し、医療機関に相談してください。</span>
      <div class="stack-s">${opts.map(([k,l,ok])=>`<button type="button" class="opt" data-act="painact" data-val="${k}" aria-pressed="${dr.painAction===k}" ${ok?'':'disabled'}>${h(l)}</button>`).join('')}</div></div>`;
  } else if(dr.pain==='discomfort'){
    painPanel=`<div class="note warn">違和感がある場合は回数を上げず様子を見ます。痛みに変わったら中止してください。</div>`;
  }
  const loadChanged= it.loaded && it.load!=null && dr.load!=='' && dr.load!=null && +dr.load!==+it.load;
  const loadSection= it.loaded ? `<section class="card stack-s" aria-labelledby="loadL">
      <span class="label" id="loadL">使用重量（kg）</span>
      <div class="stepper sm" style="max-width:260px"><button type="button" data-act="loadstep" data-d="-${v.loadStep}" aria-label="重量を${v.loadStep}kg減らす">−</button>
        <input type="number" inputmode="decimal" step="0.5" min="0" id="loadIn" data-in="load" value="${dr.load==null?'':dr.load}" placeholder="未入力" aria-label="使用重量（kg）">
        <button type="button" data-act="loadstep" data-d="${v.loadStep}" aria-label="重量を${v.loadStep}kg増やす">＋</button></div>
      <input type="text" id="loadLabel" data-in="loadlabel" value="${h(dr.loadLabel)}" placeholder="中身や器具のメモ（任意）例：リュック＋2Lボトル×3" aria-label="重量のメモ">
      ${loadChanged?`<p class="small" style="color:var(--info)">前回の重量（${fmtKg(it.load)}）から変更すると、今回できた回数を次回目標の基準にします。</p>`:''}
    </section>` : '';
  return `<div class="wrap no-tab stack">
    <div class="topbar"><button type="button" class="btn-link" data-act="nav" data-to="today">← メニュー</button><span class="small muted">${it.optional?'任意':idx+' / '+pos.filter(x=>!x.optional).length}</span></div>
    ${UI.msg?`<div class="toast" role="status">${h(UI.msg)}</div>`:''}
    <div class="stack-s">
      <h2>${h(ex.name)}</h2>
      <div class="ex-var">${h(v.name)}${v.tempo?`・${h(v.tempo)}`:''}${v.load?`・${h(v.load)}`:''}</div>
    </div>
    <div class="card stack-s">
      <span class="label">今日の目標</span>
      <div class="hero-target">${it.perSide?'<span class="u" style="margin:0 6px 0 0">各側</span>':''}${it.target}<span class="u">${it.unit}</span><span class="x">×</span>${it.sets}<span class="u">セット</span></div>
      ${it.loaded&&it.load!=null?`<div>${loadTag(it.load,it.loadLabel)}</div>`:''}
      ${st.last?`<div class="small muted">前回 ${repsText(st.last.reps)}・${h(lastFeelText(st))}${st.last.load!=null?'・'+fmtKg(st.last.load):''}</div>`:''}
      ${it.notes.map(n=>`<div class="note warn">${h(n)}</div>`).join('')}
      <button type="button" class="btn btn-sm" data-act="form" data-id="${ex.id}" data-vid="${it.variationId}" style="align-self:flex-start">フォームを見る</button>
    </div>
    ${loadSection}
    <section class="card stack" aria-labelledby="setsL">
      <span class="label" id="setsL">セット記録（${ex.type==='time'?'秒':'回'}）</span>
      ${sets}
      <p class="small muted">${anyChecked?'✓を付けていないセットは「未実施」として記録します。':'各セットが終わったら✓。✓を付けずに記録した場合は、入力した値どおり全セット実施として記録します。'}
        ✓で${it.restSec||ex.restSec}秒の休憩タイマーが始まります${it.perSide?'（左右を終えてから✓）':''}。</p>
    </section>
    <section class="card stack" aria-labelledby="feelL">
      <span class="label" id="feelL">負荷感（種目全体で1回）</span>
      <div class="feel" role="group" aria-labelledby="feelL">${feel}</div>
      <div class="field"><span class="label">フォーム</span>${segHTML('formq','form',[['good','良好'],['slight','少し崩れた'],['bad','崩れた']],dr.form)}</div>
      <div class="field"><span class="label">痛み</span>${segHTML('painq','pain',[['none','なし'],['discomfort','違和感'],['pain','痛みあり']],dr.pain)}</div>
      ${painPanel}
      <details ${dr.memo?'open':''}><summary>メモ（任意）</summary><textarea id="memo" data-in="memo" aria-label="メモ" placeholder="例：右膝がやや内に入りやすい">${h(dr.memo)}</textarea></details>
    </section>
    ${UI.err?`<p class="error" role="alert">${h(UI.err)}</p>`:''}
    <button type="button" class="btn btn-primary btn-hero" data-act="record" data-status="done">記録して次へ</button>
    <div class="btn-row">
      <button type="button" class="btn" data-act="skipex">スキップ</button>
      <button type="button" class="btn btn-danger" data-act="record" data-status="stopped">この種目を中止</button>
    </div>
  </div>`;
}

function renderFinish(){
  const s=S.sessions.find(x=>x.id===UI.sid); if(!s) return renderHome();
  const rows=s.exercises.filter(r=>r.status!=='skipped').map(r=>{
    const ex=EX[r.exerciseId], d=r.decision; const toV=ex.variations[d.to.level];
    const lvl=(d.to.variationId||toV.id)!==(r.variationId||ex.variations[r.level].id);
    let change;
    if(d.code==='paused') change='→ 一時休止';
    else if(d.code==='swap') change=`→ 次回は${h(EX[d.swapTo].name)}`;
    else if(d.code==='rest') change='→ 次回お休み';
    else if(lvl) change=`→ ${h(toV.name)} ${d.to.target}${ex.unit}`;
    else if(d.to.target===r.target) change='→ 据え置き';
    else change=`→ 次回${d.to.target}${ex.unit}`;
    return `<div class="stack-s" style="padding:12px 0;border-top:1px solid var(--line)">
      <div class="row between"><strong>${h(ex.name)}</strong>${decisionChip(d)}</div>
      <div class="num" style="font-size:22px;font-weight:600">${r.target}${ex.unit} ${change}</div>
      ${r.load!=null?`<div>${loadTag(r.load,r.loadLabel)}</div>`:''}
      <p class="small muted">${h(d.reason)}</p>
      ${d.paused?pauseWarningHTML():''}
      ${levelUpPanel(r.exerciseId)}
    </div>`;
  }).join('');
  const n=s.exercises.filter(r=>r.status!=='skipped').length;
  return `<div class="wrap no-tab stack">
    <div class="stack-s" style="padding-top:12px"><span class="label">${mdw(s.date)}・${h(s.dayLabel)}</span><h2 style="font-size:24px">今日のトレーニング完了</h2></div>
    <div class="card" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div><span class="label">実施時間</span><div class="num" style="font-size:34px;font-weight:600">${s.durationMin}<span class="small">分</span></div></div>
      <div><span class="label">実施種目数</span><div class="num" style="font-size:34px;font-weight:600">${n}<span class="small">種目</span></div></div>
    </div>
    <section class="card" aria-labelledby="nextL"><span class="label" id="nextL">次回変更予定</span><div style="margin-top:6px">${rows}</div></section>
    <button type="button" class="btn btn-primary btn-hero" data-act="nav" data-to="home">ホームへ</button>
  </div>`;
}

function renderHistory(){
  const tabs=`<div class="tabs" role="group" aria-label="表示切替">
    <button type="button" class="opt" data-act="histtab" data-val="sessions" aria-pressed="${UI.histTab==='sessions'}">日付別</button>
    <button type="button" class="opt" data-act="histtab" data-val="exercises" aria-pressed="${UI.histTab==='exercises'}">種目別</button></div>`;
  let body='';
  if(!S.sessions.length) body=`<div class="card quiet"><p class="muted">まだ記録がありません。トレーニングを記録するとここに表示されます。</p></div>`;
  else if(UI.histTab==='sessions'){
    body=S.sessions.slice().reverse().map(s=>`<article class="card stack-s">
      <div class="row between"><strong>${mdw(s.date)}</strong><span class="small muted">${h(s.dayLabel)}・${s.durationMin}分${s.mode==='short'?'・短縮':''}</span></div>
      <div>${s.exercises.map(r=>{
        const ex=EX[r.exerciseId]; if(!ex) return '';
        if(r.status==='skipped') return `<button type="button" class="hist-ex" data-act="exhist" data-id="${ex.id}"><span>${h(ex.name)}<br><span class="small muted">スキップ</span></span><span></span></button>`;
        const flags=[r.status==='stopped'?'途中で中止':FEEL[r.feel], r.form!=='good'?FORM[r.form]:'', r.pain!=='none'?PAIN[r.pain]:''].filter(Boolean).join('・');
        return `<button type="button" class="hist-ex" data-act="exhist" data-id="${ex.id}" aria-label="${h(ex.name)}の推移を見る">
          <span>${h(ex.name)}<br><span class="small muted">${h(r.variationName)}${r.load!=null?'・'+fmtKg(r.load):''}${r.optional?'・任意':''}</span></span>
          <span class="reps">${repsText(r.sets.map(x=>x.reps))}</span>
          <span class="small ${r.pain==='pain'?'':'muted'}" style="grid-column:1/-1;${r.pain==='pain'?'color:var(--danger)':''}">${h(flags)}${r.memo?`<br>メモ：${h(r.memo)}`:''}</span></button>`;
      }).join('')}</div></article>`).join('');
  } else {
    const ids=Object.keys(EX).filter(id=>S.sessions.some(s=>s.exercises.some(r=>r.exerciseId===id&&r.status!=='skipped')));
    body=`<div class="card">${ids.map(id=>{ const ex=EX[id], st=Engine.state(id);
      const cnt=S.sessions.reduce((a,s)=>a+s.exercises.filter(r=>r.exerciseId===id&&r.status!=='skipped').length,0);
      return `<button type="button" class="hist-ex" data-act="exhist" data-id="${id}"><span>${h(ex.name)}<br><span class="small muted">${h(ex.variations[st.level].name)}・${cnt}回記録</span></span>
        <span class="reps">次回 ${st.target}<span class="small">${ex.unit}</span></span></button>`; }).join('')}</div>`;
  }
  return `<div class="wrap stack"><div class="topbar"><h1 class="brand">履歴</h1></div>${tabs}${body}</div>`;
}

function renderExHist(){
  const ex=EX[UI.exId]; if(!ex) return renderHistory();
  const st=Engine.state(ex.id);
  const rows=[];

/* ---------- Form dialog（フォーム解説・動画） ----------
   モーダル表示のみで画面遷移しない。draft・セット✓・休憩タイマー（rest.endAt）には一切触れない。 */
function parseVideoUrl(url){
  if(!url) return null;
  const yt=String(url).match(/(?:youtube(?:-nocookie)?\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
  if(yt) return {provider:'youtube', videoId:yt[1], title:'フォーム動画', source:'', verifiedAt:null};
  if(/\.(mp4|webm)(\?|#|$)/i.test(url)) return {provider:'file', url, title:'フォーム動画', source:'', verifiedAt:null};
  return {provider:'link', url, title:'フォーム動画', source:'', verifiedAt:null};
}
/* 優先順位：variation.video → exercise.video → variation.videoUrl → exercise.videoUrl（videoPendingの段階は共通動画に落とさない） */
function resolveVideo(ex, v){
  if(v && v.video) return Object.assign({from:'variation'}, v.video);
  if(v && v.videoPending) return v.videoUrl ? Object.assign({from:'variationUrl'}, parseVideoUrl(v.videoUrl)) : null;
  if(ex.video) return Object.assign({from:'exercise'}, ex.video);
  if(v && v.videoUrl) return Object.assign({from:'variationUrl'}, parseVideoUrl(v.videoUrl));
  if(ex.videoUrl) return Object.assign({from:'exerciseUrl'}, parseVideoUrl(ex.videoUrl));
  return null;
}
const Video = {
  token:0, player:null, apiPromise:null, current:null,
  inArtifact(){ return !!(window.claude && typeof window.claude.use==='function'); },   // Claudeのアーティファクト表示では外部iframeを埋め込めない
  online(){ return !(typeof navigator!=='undefined' && navigator.onLine===false); },
  watchUrl(m){ return m.provider==='youtube' ? 'https://www.youtube.com/watch?v='+encodeURIComponent(m.videoId) : m.url; },
  embedUrl(m){
    const origin=(typeof location!=='undefined' && /^https?:/.test(location.origin||''))?'&origin='+encodeURIComponent(location.origin):'';
    return 'https://www.youtube-nocookie.com/embed/'+encodeURIComponent(m.videoId)+'?rel=0&playsinline=1&enablejsapi=1'+origin;   // 自動再生なし
  },
  metaHTML(m, withLink){
    const link= withLink ? `<a class="btn btn-sm" href="${h(this.watchUrl(m))}" target="_blank" rel="noopener noreferrer">${m.provider==='youtube'?'YouTubeで開く':'動画を開く'}</a>` : '';
    return `<div class="video-meta"><div class="small">${m.source?`<span class="muted">フォーム動画</span> ${h(m.source)}`:'<span class="muted">フォーム動画</span>'}
      ${m.verifiedAt?`<div class="tiny muted">動画確認：${h(m.verifiedAt)}</div>`:''}</div>${link}</div>`;
  },
  html(m, pending){
    if(!m) return `<div class="video-empty" role="note">${h(pending||'動画準備中')}</div>`;
    if(!this.online()) return `<div class="video-empty" role="note">フォーム動画の表示にはインターネット接続が必要です</div>${this.metaHTML(m,false)}`;
    if(m.provider==='youtube'){
      if(this.inArtifact()) return `<div class="video-empty" role="note">この表示環境では動画を埋め込めません。下の「YouTubeで開く」から見られます</div>${this.metaHTML(m,true)}`;
      return `<div class="video" id="videoSlot"><iframe id="ytFrame" src="${h(this.embedUrl(m))}" title="${h(m.title||'フォーム動画')}" loading="lazy"
        allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>${this.metaHTML(m,true)}`;
    }
    if(m.provider==='file') return `<div class="video" id="videoSlot"><video controls preload="none" playsinline src="${h(m.url)}" title="${h(m.title||'フォーム動画')}"></video></div>${this.metaHTML(m,false)}`;
    return this.metaHTML(m,true);
  },
  /* 動画が削除・非公開・埋め込み禁止のときは動画エリアだけ差し替える（アプリ全体は止めない） */
  fail(){ const slot=document.getElementById('videoSlot'); if(slot) slot.outerHTML=`<div class="video-empty" id="videoSlot" role="note">現在この動画を表示できません</div>`; },
  mount(m){
    this.current=m;
    const tok=++this.token;
    if(!m) return;
    if(m.provider==='file'){ const vEl=document.querySelector('#videoSlot video'); if(vEl&&vEl.addEventListener) vEl.addEventListener('error',()=>this.fail()); return; }
    if(m.provider!=='youtube' || this.inArtifact() || !this.online()) return;
    // 既存iframeにYouTube公式IFrame APIを接続し、再生エラー（削除・非公開・埋め込み禁止）だけを検知する。APIが読めなくてもiframeはそのまま再生できる
    this.loadApi().then(ok=>{
      if(!ok || tok!==this.token || !document.getElementById('ytFrame')) return;
      try{ this.player=new window.YT.Player('ytFrame',{events:{onError:()=>{ if(tok===this.token) this.fail(); }}}); }catch(e){}
    });
  },
  loadApi(){
    if(window.YT && window.YT.Player) return Promise.resolve(true);
    if(this.apiPromise) return this.apiPromise;
    this.apiPromise=new Promise(res=>{
      let done=false; const fin=v=>{ if(!done){ done=true; if(!v) this.apiPromise=null; res(v); } };
      const prev=window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady=function(){ try{ if(prev) prev(); }catch(e){} fin(true); };
      try{ const sc=document.createElement('script'); sc.src='https://www.youtube.com/iframe_api'; sc.async=true; sc.onerror=()=>fin(false); document.head.appendChild(sc); }catch(e){ fin(false); }
      setTimeout(()=>fin(!!(window.YT&&window.YT.Player)), 8000);
    });
    return this.apiPromise;
  },
  destroy(){ this.token++; try{ if(this.player && this.player.destroy) this.player.destroy(); }catch(e){} this.player=null; this.current=null; }
};

    ${!st.pausedByPain && st.painNote?`<div class="note pain">前回は痛みあり：${h(st.painNote)}。痛みが出たら中止してください。</div>`:''}
    <div class="stack-s" id="videoArea">${Video.html(m, v.videoPending)}</div>

    <div class="stack-s"><span class="label">ポイント</span><ul class="dlg-list">${ex.cues.map(c=>`<li>${h(c)}</li>`).join('')}</ul></div>
    <div class="stack-s"><span class="label">よくあるNG</span><ul class="dlg-list">${ex.mistakes.map(c=>`<li>${h(c)}</li>`).join('')}</ul></div>
    <div class="card quiet flat stack-s" style="padding:14px">
      <div><span class="label">やさしくするなら</span><div>${varBtn(easier,'これが最もやさしい段階です')}</div></div>
      <div><span class="label">難しくするなら</span><div>${varBtn(harder,'これが最も難しい段階です')}</div></div>
    </div>

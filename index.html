/* ---------- 休憩タイマー ----------
   残り秒数を1ずつ減らすのではなく「終了予定時刻 endAt」を保存し、表示のたびに endAt − 現在時刻 で計算する。
   画面ロック・別アプリ・再読み込みのあとも、戻った時点で正しい残り時間になる。 */
const Rest = {
  timer:null, audio:null,
  get(){ return S.active && S.active.rest; },
  start(i, exerciseId, setIndex, sec){
    const now=Date.now();
    S.active.rest={i, exerciseId, setIndex, durationSec:sec, startedAt:now, endAt:now+sec*1000, notified:false};
    save(); this.ensureTick(); this.paint();
  },
  add(sec){ const r=this.get(); if(!r) return; const now=Date.now(); r.endAt=Math.max(now,r.endAt)+sec*1000; r.durationSec=Math.max(r.durationSec, Math.ceil((r.endAt-now)/1000)); r.notified=false; save(); this.ensureTick(); this.paint(); },
  stop(){ if(S.active && S.active.rest){ S.active.rest=null; save(); } this.paint(); },
  remaining(){ const r=this.get(); return r? Math.max(0, Math.ceil((r.endAt-Date.now())/1000)) : 0; },
  ensureTick(){ if(!this.timer) this.timer=setInterval(()=>this.tick(), 250); },
  tick(){
    const r=this.get();
    if(!r){ clearInterval(this.timer); this.timer=null; this.paint(); return; }
    if(Date.now()>=r.endAt && !r.notified){ r.notified=true; save(); this.notify(); }
    this.paint();
  },
  restore(){   // 起動時：休憩中なら復元、終了から10分以上たっていれば片付ける
    const r=this.get(); if(!r) return;
    if(Date.now()-r.endAt>10*60*1000){ S.active.rest=null; save(); return; }
    this.ensureTick();
  },
  notify(){
    try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
    if(S.settings && S.settings.restSound) this.beep();
    const live=document.getElementById('srLive'); if(live) live.textContent='休憩が終わりました。次のセットへ';
  },
  unlock(){   // iPhoneでは音を鳴らすのにユーザー操作が必要なので、✓のタップ時に準備する
    if(!S.settings || !S.settings.restSound) return;
    try{ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; this.audio=this.audio||new AC(); if(this.audio.state==='suspended') this.audio.resume(); }catch(e){}
  },
  beep(){
    try{ const c=this.audio; if(!c) return;
      [0,0.28].forEach(t=>{ const o=c.createOscillator(), g=c.createGain(); o.frequency.value=880;
        g.gain.setValueAtTime(0.0001,c.currentTime+t); g.gain.exponentialRampToValueAtTime(0.3,c.currentTime+t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+t+0.2);
        o.connect(g); g.connect(c.destination); o.start(c.currentTime+t); o.stop(c.currentTime+t+0.22); });
    }catch(e){}
  },
  paint(){
    const bar=document.getElementById('restbar'); if(!bar) return;
    const r=this.get(); const show=!!r && (UI.screen==='exercise'||UI.screen==='today');
    const dr=document.getElementById('dlgRest');   // フォーム解説を開いている間も残り時間を表示（表示のみ）
    if(dr){ if(!r){ dr.hidden=true; } else { const rm=this.remaining(); dr.hidden=false; dr.textContent= rm>0 ? '休憩 '+Math.floor(rm/60)+':'+String(rm%60).padStart(2,'0') : '休憩終了｜次のセットへ'; if(dr.classList) dr.classList.toggle('done', rm<=0); } }
    bar.hidden=!show; if(document.body&&document.body.classList) document.body.classList.toggle('has-restbar',show);
    if(!show) return;
    const rem=this.remaining(), done=rem<=0;
    const T=document.getElementById('rbTime'), Lb=document.getElementById('rbLabel'), Sb=document.getElementById('rbSub'), F=document.getElementById('rbFill'), I=bar.querySelector('.rb-inner');
    if(T) T.textContent=Math.floor(rem/60)+':'+String(rem%60).padStart(2,'0');
    if(Lb) Lb.textContent= done?'休憩終了':'休憩';
    if(I) I.classList.toggle('done',done);
    const ex=EX[r.exerciseId]; if(Sb) Sb.textContent=(ex?ex.name:'')+'・セット'+(r.setIndex+1)+'のあと'+(done?'｜次のセットへ':'');
    if(F) F.style.width=(done?0:Math.min(100,Math.max(0,(r.endAt-Date.now())/(r.durationSec*1000)*100)))+'%';
  }
};
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) Rest.tick(); });
window.addEventListener('pageshow', ()=>Rest.tick());

/* ---------- Actions ---------- */
function openExercise(i){
  const A=S.active, it=A.items[i];
  if(A.draft && A.draft.i===i){ UI.i=i; UI.draft=A.draft; go('exercise',{scrollTop:true}); return; }   // 入力途中を復元
  const r=Rest.get(); if(r && r.i!==i) Rest.stop();   // 別の種目へ移ったら前の休憩は終了
  const ex=EX[it.exerciseId], v=ex.variations[it.level], st=Engine.state(it.exerciseId);
  const usedBefore= st.last && st.last.variationId===it.variationId;   // 記録済みなら空欄も尊重（既定重量で埋めない）
  UI.i=i; UI.draft={i, sets:Array.from({length:it.sets},()=>({reps:it.target, done:false})), feel:null, form:'good', pain:'none', painAction:'rom', memo:'',
    load: it.loaded ? (it.load!=null?it.load:(!usedBefore&&v.defaultLoad!=null?v.defaultLoad:'')) : null, loadLabel: it.loadLabel||''};
  A.draft=UI.draft; save();
  go('exercise',{scrollTop:true});
}
function afterRecord(){
  const n=Session.nextTodo(UI.i);
  if(n>=0) openExercise(n);
  else if(Session.optionalLeft()) go('today',{msg:'予定の種目は完了です。任意の補助種目を行うか、トレーニングを終えてください'});
  else { UI.msg=null; const sid=Session.finish(); if(sid) go('finish',{sid}); else go('home',{msg:'記録がないため保存しませんでした'}); }
}
async function doExport(){
  const data=JSON.stringify(Object.assign({app:'ietore', exportedAt:new Date().toISOString()}, S), null, 2);
  const filename=`ietore-backup-${ymd()}.json`;
  UI.exportText=data; render();
  // Claudeのアーティファクト内：downloads機能で保存 / 通常のWeb（GitHub Pages等）：ダウンロードリンク
  if(window.claude && typeof window.claude.use==='function'){
    try{
      const dl=await window.claude.use('downloads');
      if(dl){ await dl.save({filename, data}); UI.msg='バックアップを保存しました'; render(); }
    }catch(e){ /* 断られた・使えない場合は下のテキストで保存 */ }
    return;
  }
  try{
    const blob=new Blob([data],{type:'application/json'}); const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
  }catch(e){}
}
function readImport(text){
  UI.importErr=null; UI.importPreview=null;
  try{ const o=JSON.parse(text); if(!isValidBackup(o)) throw new Error('bad'); UI.importPreview=o; }
  catch(e){ UI.importErr='読み込めませんでした。このアプリで書き出したJSONか確認してください。'; }
  render();
}

const A = {
  nav(d){ UI.msg=null; UI.resumeConfirm=null; UI.lvErr={}; UI.goalOpen=false; UI.sd=null; UI.exportText=null; UI.importPreview=null; UI.importErr=null; UI.confirmReset=false; UI.confirmDiscard=false; UI.goalEdits={}; UI.lvLoad={}; go(d.to); },
  sdset(d){
    const v=d.key==='freq'?+d.val:(d.key==='restSound'?d.val==='on':d.val); UI.sd[d.key]=v;
    if(d.key==='freq' && UI.sd.days.length>v) UI.sd.days=UI.sd.days.slice(-v);   // 週回数より多い曜日は古い選択から外す
    render();
  },
  sdtoggle(d){
    const key=d.key; const val= key==='equipment'?d.val:+d.val; let arr=UI.sd[key].slice();
    if(arr.includes(val)) arr=arr.filter(x=>x!==val); else arr.push(val);
    if(key==='equipment'){ if(val==='none' && arr.includes('none')) arr=['none']; else arr=arr.filter(x=>x!=='none'); }
    if(key==='days' && arr.length>+UI.sd.freq) arr=arr.slice(-UI.sd.freq);          // 上限を超えたら最初に選んだ曜日を外す
    UI.sd[key]=arr; render();
  },
  savesetup(){
    if(!daysStatus(UI.sd).ok) return;
    const goals={}; Object.keys(EX).forEach(id=>{ goals[id]=finalGoal(id,'setup'); });
    S.settings=Object.assign(defaultSettings(), UI.sd, {createdAt:ymd()}); S.rotation=0;
    Object.keys(EX).forEach(id=>{ S.exercises[id]=Engine.newState(id, goals[id]); });
    save(); UI.sd=null; UI.goalEdits={}; go('home');
  },
  savesettings(){
    if(!daysStatus(UI.sd).ok) return;
    const old=S.settings;
    const goals={}; Object.keys(UI.goalEdits).forEach(id=>{ goals[id]=finalGoal(id,'settings'); });
    if(UI.sd.freq!==old.freq) S.rotation=0;
    S.settings=Object.assign({}, old, UI.sd);
    Object.keys(goals).forEach(id=>Engine.setGoal(id, goals[id]));
    save(); UI.sd=null; UI.goalEdits={}; go('settings',{msg:'設定を保存しました'});
  },
  goalvar(d,t){
    const ex=EX[d.id], i=Engine.idx(ex,t.value), v=ex.variations[i], mode=UI.screen==='setup'?'setup':'settings';
    const cur=goalOf(d.id,mode);
    UI.goalEdits[d.id]=Object.assign({}, UI.goalEdits[d.id]||{}, {variationId:v.id, target:clamp(+cur.target||v.repMin, v.repMin, v.repMax),
      load:v.loaded?(cur.load!=null&&cur.load!==''?cur.load:(v.defaultLoad!=null?v.defaultLoad:'')):null});
    render();
  },
  goalstep(d){
    const mode=UI.screen==='setup'?'setup':'settings', g=finalGoal(d.id,mode);
    UI.goalEdits[d.id]=Object.assign({}, UI.goalEdits[d.id]||{}, {variationId:g.variationId, target:clamp(g.target+(+d.d), g.v.repMin, g.v.repMax)});
    render();
  },
  goalsets(d){ UI.goalEdits[d.key]=Object.assign({}, UI.goalEdits[d.key]||{}, {sets:+d.val}); render(); },
  goalrest(d){ UI.goalEdits[d.key]=Object.assign({}, UI.goalEdits[d.key]||{}, {rest:+d.val}); render(); },
  sdint(d){ UI.sd.sportIntensity=Object.assign({}, UI.sd.sportIntensity||{}, {[d.key]:d.val}); render(); },
  warmup(){ UI.warm={}; go('warmup'); },
  warmcheck(d){ UI.warm[d.i]=!UI.warm[d.i]; render(); },
  warmdone(){ go('home',{msg:'ウォームアップ完了。いってらっしゃい'}); },
  loadstep(d){ const cur=+UI.draft.load||0; UI.draft.load=Math.max(0, Math.round((cur+(+d.d))*10)/10); render(); },
  weightup(d){
    const kg=UI.lvLoad[d.id]!=null&&UI.lvLoad[d.id]!==''?+UI.lvLoad[d.id]:null;
    const st=Engine.state(d.id), step=EX[d.id].variations[st.level].loadStep;
    const val= kg!=null&&!isNaN(kg)? kg : (st.load!=null? Math.round((st.load+step)*10)/10 : null);
    UI.lvErr=UI.lvErr||{}; UI.lvErr[d.id]=null;
    if(val==null || val<=0){ UI.lvErr[d.id]='新しい重量（kg）を入力してください'; render(); return; }
    if(st.load!=null && val<=st.load){ UI.lvErr[d.id]=`現在の${fmtKg(st.load)}より重い値を入力してください。軽くする場合は、次回のトレーニングで重量を変えて記録してください`; render(); return; }
    Engine.acceptWeightUp(d.id, val); delete UI.lvLoad[d.id]; save(); UI.msg=`${EX[d.id].name}：次回から${fmtKg(val)}`; render();
  },
  startcheck(){ UI.cond={sleep:'normal', fatigue:'normal', soreness:'none'}; UI.short=S.settings.duration==='short'; UI.msg=null; go('check'); },
  cond(d){ UI.cond[d.key]=d.val; render(); },
  toggleshort(){ UI.short=!UI.short; render(); },
  begin(){ Session.begin(UI.cond, UI.short); go('today'); },
  resume(){
    UI.msg=null; const Ac=S.active;
    if(Ac.draft && Ac.items[Ac.draft.i] && Ac.items[Ac.draft.i].state==='todo'){ UI.i=Ac.draft.i; UI.draft=Ac.draft; go('exercise'); }
    else go('today');
  },
  continue(){ const n=Session.nextTodo(-1); if(n>=0) openExercise(n); },
  openex(d){ UI.msg=null; openExercise(+d.i); },
  form(d){ const ex=EX[d.id]; const vid=d.vid || (d.level!=null && ex && ex.variations[+d.level] ? ex.variations[+d.level].id : null); openForm(d.id, vid, vid); },
  formvar(d){ if(UI.form) openForm(d.id, d.vid, UI.form.cur); },
  closedlg(){ closeForm(); },
  rep(d){ const s=UI.draft.sets[+d.s]; s.reps=Math.max(0,(+s.reps||0)+(+d.d)); render(); },
  checkset(d){
    const k=+d.s, s=UI.draft.sets[k], it=S.active.items[UI.i], r=Rest.get();
    s.done=!s.done;
    if(s.done){
      const last= k===UI.draft.sets.length-1 || UI.draft.sets.every(x=>x.done);   // 最後のセットのあとは休憩なし
      if(!last){ Rest.unlock(); Rest.start(UI.i, it.exerciseId, k, it.restSec||EX[it.exerciseId].restSec); }
      else if(r) Rest.stop();
    } else if(r && r.i===UI.i && r.setIndex===k) Rest.stop();
    render();
  },
  restadd(){ Rest.add(30); },
  restend(){ Rest.stop(); },
  restnext(){
    const r=Rest.get(); Rest.stop();
    if(UI.screen!=='exercise' && r && S.active && S.active.items[r.i] && S.active.items[r.i].state==='todo'){ openExercise(r.i); }
    const k=UI.draft?UI.draft.sets.findIndex(x=>!x.done):-1;
    if(k>=0){ const b=document.querySelector(`[data-act="checkset"][data-s="${k}"]`); if(b){ if(b.scrollIntoView) b.scrollIntoView({block:'center'}); if(b.focus) b.focus(); } }
  },
  pauseskip(d){ Session.pauseSkip(+d.i); render(); },
  pausealt(d){ const alt=Session.useAlt(+d.i); UI.msg= alt?`代替種目（${EX[alt].name}）に変更しました`:'使える代替種目がありません'; render(); },
  pauseresumeask(d){ UI.resumeConfirm=d.id; render(); },
  pauseresumecancel(){ UI.resumeConfirm=null; render(); },
  pauseresume(d){ const it=S.active.items[+d.i]; Session.resumePaused(+d.i); UI.resumeConfirm=null; UI.msg=`${EX[it.exerciseId].name}を再開しました（回数は据え置き）`; render(); },
  pauseresumeset(d){ Engine.resumeFromPause(d.id); save(); UI.resumeConfirm=null; UI.msg=`${EX[d.id].name}を再開しました（回数は据え置き）`; render(); },
  stallkeep(d){ const s=stallInfo(d.id); if(s){ S.exercises[d.id].stallAck=s.key; save(); } UI.msg=`${EX[d.id].name}：このまま継続します`; render(); },
  stallrest(d){ const ex=EX[d.id], st=S.exercises[d.id], cur=Engine.restOf(ex,st), nx=Math.min(cur+30,150);
    st.restSec= nx===ex.restSec?null:nx; const s=stallInfo(d.id); if(s) st.stallAck=s.key; save(); UI.msg=`${ex.name}：次回から休憩を${nx}秒にします`; render(); },
  stalladjust(d){ UI.sd=null; UI.goalEdits={}; UI.msg=null; UI.goalOpen=true; go('settings',{goalFocus:d.id}); },
  feel(d){ UI.draft.feel=+d.val; UI.err=null; render(); },
  formq(d){ UI.draft.form=d.val; render(); },
  painq(d){ UI.draft.pain=d.val; if(d.val==='pain'){ const ex=EX[S.active.items[UI.i].exerciseId]; UI.draft.painAction=Engine.easier(ex,S.active.items[UI.i].level)>=0?'easier':'rom'; } render(); },
  painact(d){ UI.draft.painAction=d.val; render(); },
  record(d){
    const status=d.status;
    if(status==='done' && !UI.draft.feel){ UI.err='負荷感を選んでください'; render(); const e=document.querySelector('.error'); if(e) e.scrollIntoView({block:'center'}); return; }
    const it=S.active.items[UI.i]; const dec=Session.record(UI.i, UI.draft, status);
    UI.msg=`${EX[it.exerciseId].name}：${dec.label}`;
    afterRecord();
  },
  skipex(){ Session.skip(UI.i); UI.msg=`${EX[S.active.items[UI.i].exerciseId].name}をスキップしました（次回目標は変わりません）`; afterRecord(); },
  undo(d){ Session.undo(+d.i); UI.msg='記録を取り消しました'; render(); },
  finish(){ const sid=Session.finish(); UI.msg=null; if(sid) go('finish',{sid}); else go('home',{msg:'記録がないため保存しませんでした'}); },
  discardask(){ UI.confirmDiscard=true; render(); },
  discardno(){ UI.confirmDiscard=false; render(); },
  discardyes(){ Session.discard(); UI.confirmDiscard=false; go('home',{msg:'今回の記録を取り消しました'}); },
  levelup(d){ Engine.acceptLevelUp(d.id); save(); UI.msg=`${EX[d.id].name}：次回から難易度アップ`; render(); },
  leveldecline(d){ Engine.declineLevelUp(d.id); save(); render(); },
  histtab(d){ UI.histTab=d.val; render(); },
  exhist(d){ go('exhist',{exId:d.id}); },
  unsub(d){ delete S.subs[d.id]; save(); render(); },
  export(){ doExport(); },
  copyexport(){
    const ta=$('#exportText');
    const fallback=()=>{ if(ta){ ta.focus(); ta.select(); } };
    try{ navigator.clipboard.writeText(UI.exportText).then(()=>{ UI.msg='コピーしました'; render(); }, fallback); }catch(e){ fallback(); }
  },
  importpaste(){ const t=$('#importText'); readImport(t?t.value:''); },
  importconfirm(){
    const o=UI.importPreview; delete o.app; delete o.exportedAt;
    S=migrate(o); save(); UI.importPreview=null; UI.sd=null; UI.exportText=null;
    go(S.settings?'home':'setup',{msg:'データを読み込みました'});
  },
  importcancel(){ UI.importPreview=null; render(); },
  resetask(){ UI.confirmReset=true; render(); },
  resetno(){ UI.confirmReset=false; render(); },
  resetyes(){ S=defaultState(); save(); UI.confirmReset=false; UI.sd=null; go('setup'); }
};

document.addEventListener('click', e=>{
  const t=e.target.closest('[data-act]'); if(!t || t.disabled) return;
  const fn=A[t.dataset.act]; if(fn){ e.preventDefault(); fn(t.dataset, t); }
});
document.addEventListener('input', e=>{
  const t=e.target; const k=t.dataset&&t.dataset.in; if(!k) return;
  if(k==='rep'){ UI.draft.sets[+t.dataset.s].reps=Math.max(0,parseInt(t.value,10)||0); }
  else if(k==='memo'){ UI.draft.memo=t.value; }
  else if(k==='sportname'){ UI.sd.sportName=t.value; }
  else if(k==='load'){ UI.draft.load=t.value===''?'':+t.value; }
  else if(k==='loadlabel'){ UI.draft.loadLabel=t.value; }
  else if(k==='lvload'){ UI.lvLoad[t.dataset.id]=t.value; }
  else if(k==='goaltarget'){ const id=t.dataset.id; UI.goalEdits[id]=Object.assign({}, UI.goalEdits[id]||{}, {target:parseInt(t.value,10)||0}); }
  else if(k==='goalload'){ const id=t.dataset.id; UI.goalEdits[id]=Object.assign({}, UI.goalEdits[id]||{}, {load:t.value}); }
  if(S.active && UI.screen==='exercise' && ['rep','memo','load','loadlabel'].includes(k)) save();   // 入力途中も保存
});
document.addEventListener('change', e=>{
  const t=e.target; const k=t.dataset&&t.dataset.in;
  if(k==='goalvar'){ A.goalvar(t.dataset, t); return; }
  if(k==='goaltarget'||k==='goalload'){ render(); return; }
  if(k==='importfile' && t.files && t.files[0]){
    const fr=new FileReader(); fr.onload=()=>readImport(String(fr.result)); fr.onerror=()=>{ UI.importErr='ファイルを読み込めませんでした'; render(); }; fr.readAsText(t.files[0]);
  }
});
$('#dlg').addEventListener('click', e=>{ if(e.target.id==='dlg') closeForm(); });
$('#dlg').addEventListener('close', ()=>{ Video.destroy(); UI.form=null; $('#dlgBody').innerHTML=''; });  // 動画を確実に停止
window.addEventListener('online', refreshFormVideo);
window.addEventListener('offline', refreshFormVideo);

/* PWA: <link rel="manifest"> がある環境（GitHub Pages版）でのみ Service Worker を登録 */
Rest.restore();
if('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]')){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./service-worker.js').catch(()=>{}); });
}

render();
</script>
